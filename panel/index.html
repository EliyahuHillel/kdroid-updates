<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>קיידרואיד · ניהול</title>
<link rel="icon" href="icon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* App palette: Material 3 scheme from seed #006C51 (same as the Android app) */
:root{
  --primary:#006C51; --on-primary:#fff; --primary-c:#83F8CD; --on-primary-c:#002116; --primary-d:#00513C;
  --secondary:#4C6359; --secondary-c:#CEE9DB; --on-secondary-c:#082017;
  --tertiary:#3F6375; --tertiary-c:#C2E8FD; --on-tertiary-c:#001F2B;
  --error:#BA1A1A; --error-c:#FFDAD6; --on-error-c:#410002;
  --bg:#F4F6F2; --surface:#FBFDF9; --surface-hi:#EFF1EE; --on:#191C1A; --variant:#DBE5DE; --on-variant:#404944;
  --outline:#707974; --outline-v:#BFC9C2; --warn:#8A5100; --warn-c:#FFDDB8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --font:'Noto Sans Hebrew',system-ui,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --primary:#66DBB2; --on-primary:#003829; --primary-c:#00513C; --on-primary-c:#83F8CD; --primary-d:#83F8CD;
  --secondary:#B3CCBF; --secondary-c:#354C42; --on-secondary-c:#CEE9DB;
  --tertiary:#A7CCE0; --tertiary-c:#264B5C; --on-tertiary-c:#C2E8FD;
  --error:#FFB4AB; --error-c:#93000A; --on-error-c:#FFDAD6;
  --bg:#111412; --surface:#191C1A; --surface-hi:#232624; --on:#E1E3E0; --variant:#404944; --on-variant:#BFC9C2;
  --outline:#89938D; --outline-v:#404944; --warn:#FFB86E; --warn-c:#4A2800;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--on);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (max-width:720px){
  #devRows~*{}
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block}
  table.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:14px 4px;border-bottom:1px solid var(--outline-v)}
  table.cards td{border:0;padding:0;font-size:13.5px}
  table.cards td.nm{grid-column:1/-1;font-size:15.5px}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--on-variant);font-weight:600}
}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--outline-v);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.subtabs button{font:inherit;font-weight:600;font-size:14.5px;background:none;border:0;padding:10px 14px;color:var(--on-variant);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.sw2 span b{display:block;font-weight:600}.sw2 span .muted{display:block}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-inline-end:1px solid var(--outline-v);padding:18px 12px 14px;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand b{font-size:18px;font-weight:700;display:block;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--on-variant)}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs .grp{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--outline);padding:14px 12px 6px}
nav.tabs a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--on-variant);text-decoration:none;font-weight:500;font-size:14.5px}
nav.tabs a svg{width:21px;height:21px;flex:none}
nav.tabs a:hover{background:var(--surface-hi);color:var(--on)}
nav.tabs a.on{background:var(--secondary-c);color:var(--on-secondary-c);font-weight:700}
nav.tabs a .count{margin-inline-start:auto}
.me{margin-top:14px;border-top:1px solid var(--outline-v);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-weight:700;flex:none}
.me .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.me .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--secondary-c);color:var(--on-secondary-c)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--error);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
@media (prefers-color-scheme:dark){.count{color:#690005}}
.mtop{display:none}
main{padding:28px 32px 56px;max-width:1240px;width:100%}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.phead .tt{flex:1;min-width:220px}
.phead h1{font-size:26px;font-weight:700;letter-spacing:-.2px}
.phead p{margin:4px 0 0;color:var(--on-variant);font-size:14.5px}
.scrim{display:none}
@media (max-width:1000px){
  .shell{display:block}
  .mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;min-height:58px;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--outline-v)}
  .mtop b{font-size:17px}
  .mtop img{width:30px;height:30px;border-radius:8px}
  .mtop .mb{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--on)}
  .side{position:fixed;inset:0 0 0 auto;width:min(300px,86vw);transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
  body.navopen .side{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  main{padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
  .phead h1{font-size:22px}
}
.card{background:var(--surface);border:1px solid var(--outline-v);border-radius:16px;box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--outline-v);flex-wrap:wrap}
.card>.hd h2{font-size:16px;font-weight:600}
.card>.bd{padding:16px 18px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--outline-v);text-decoration:none;color:inherit;display:block}
.tile:hover{border-color:var(--primary)}
.tile{display:flex!important;gap:14px;align-items:center}
.tile .ti{width:44px;height:44px;border-radius:14px;background:var(--secondary-c);color:var(--on-secondary-c);display:grid;place-items:center;flex:none}
.tile.alert .ti{background:var(--error-c);color:var(--on-error-c)}
.tile .v{font-size:28px;font-weight:700;line-height:1.1}
.linkbox{display:flex;gap:8px;align-items:center;border:1px dashed var(--outline);border-radius:12px;padding:8px 8px 8px 12px;background:var(--surface-hi)}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.tile .l{font-size:13px;color:var(--on-variant);margin-top:4px}
.tile.alert .v{color:var(--error)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:20px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.out{background:transparent;border-color:var(--outline);color:var(--primary)}
.btn.text{background:transparent;color:var(--primary);padding:0 10px}
.btn.danger{background:transparent;border-color:var(--error);color:var(--error)}
.btn.danger.fill{background:var(--error);color:var(--on-primary)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],select,textarea{
  width:100%;min-width:0;background:transparent;border:1px solid var(--outline);border-radius:6px;padding:10px 12px;font-size:15px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:1px solid var(--primary)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--on-variant);margin-bottom:5px}
.field{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--on-variant);font-size:13px}
.err{color:var(--error);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.active{background:var(--primary-c);color:var(--on-primary-c)}
.pill.pending{background:var(--warn-c);color:var(--warn)}
.pill.released{background:var(--variant);color:var(--on-variant)}
.instblock{border:1px solid var(--outline-v);border-radius:12px;margin-bottom:12px;overflow:hidden}
.insthead{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.insthead .main{flex:1;min-width:200px}
.instperm{display:flex;flex-wrap:wrap;gap:4px 24px;align-items:center;padding:0 16px 10px}
.instperm .sw{flex:1;min-width:220px;border:0;padding:4px 0}
.instdevs{border-top:1px solid var(--outline-v);background:var(--surface-hi)}
.instdevs .item{flex-wrap:wrap;padding:12px 16px;gap:10px;align-items:center;border-bottom:1px solid var(--outline-v)}
.instdevs .item:last-child{border-bottom:0}
.instdevs .item .main{min-width:200px}
.instdevs .row{flex-wrap:nowrap;gap:8px;align-items:center}
.instdevs select{width:auto;min-width:140px;max-width:240px;height:36px;padding:0 10px}
.instdevs .addrow .row select{flex:1;max-width:none}
.instdevs .empty{padding:16px}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:640px){.pickrow{grid-template-columns:1fr}}
.pk{display:flex;gap:12px;align-items:flex-start;text-align:right;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--outline-v);border-radius:14px;padding:14px;cursor:pointer}
.pk b{display:block;font-size:15px}.pk .muted{display:block;margin-top:2px}
.pk.on{border:2px solid var(--primary);background:color-mix(in srgb,var(--secondary-c) 55%,var(--surface));padding:13px}
.pk .badgeicon{background:var(--primary-c);color:var(--on-primary-c)}
.seg{display:inline-flex;margin-top:14px;border:1px solid var(--outline);border-radius:999px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--on-variant);border-radius:999px;padding:7px 16px;cursor:pointer}
.seg button.on{background:var(--secondary-c);color:var(--on-secondary-c)}
.dlopts{display:grid;gap:10px;margin-top:14px}
.dlopt{display:flex;align-items:center;gap:14px;border:1px solid var(--outline-v);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.dlopt .main{flex:1;min-width:200px}.dlopt .t{font-weight:600;margin-bottom:2px}
.bar{height:8px;border-radius:4px;background:var(--variant);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
.dlbtns{display:flex;gap:8px;flex-wrap:wrap}
.dlopt .badgeicon{background:var(--primary-c);color:var(--on-primary-c)}
.pill.wait{background:var(--tertiary-c);color:var(--on-tertiary-c)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.empty{text-align:center;color:var(--on-variant);padding:36px 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--outline);background:transparent;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--on-variant)}
.chip.on{background:var(--secondary-c);border-color:transparent;color:var(--on-secondary-c);font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--on-variant);text-align:right;padding:10px 14px;border-bottom:1px solid var(--outline-v);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--outline-v);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-hi)}
td .sub{font-size:12.5px;color:var(--on-variant)}
.list>.item{padding:14px 18px;border-bottom:1px solid var(--outline-v);display:flex;gap:14px;align-items:flex-start}
.list>.item:last-child{border-bottom:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .x{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.badgeicon{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--outline-v);border-radius:12px;cursor:pointer;margin-bottom:8px}
.opt.on{border:2px solid var(--primary);background:var(--secondary-c);padding:11px 13px}
.opt input{margin-top:4px;accent-color:var(--primary)}
.opt b{display:block;font-weight:600}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--outline-v)}
.sw span{flex:1}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle i{position:absolute;inset:0;border-radius:14px;background:var(--variant);border:2px solid var(--outline);transition:.15s}
.toggle i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--outline);top:5px;right:5px;transition:.15s}
.toggle input:checked+i{background:var(--primary);border-color:var(--primary)}
.toggle input:checked+i::after{width:20px;height:20px;top:2px;right:20px;background:var(--on-primary)}
.toggle input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.applist{max-height:340px;overflow:auto;border:1px solid var(--outline-v);border-radius:10px;margin:8px 0 10px}
.applist label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--outline-v);cursor:pointer}
.applist label:last-child{border-bottom:none}
.applist input{accent-color:var(--primary)}
.acts .act{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--outline-v)}
.acts .act:last-child{border-bottom:0}
.acts .act .main{flex:1;min-width:0}.acts .act b{display:block;font-weight:600}.acts .act .muted{display:block}
.acts .act.danger b{color:var(--error)}
.chip .cn{display:inline-block;min-width:20px;margin-inline-start:6px;padding:0 6px;border-radius:9px;background:var(--surface-hi);font-size:12px;font-weight:700}
.chip.on .cn{background:var(--surface)}
.who2{display:flex;gap:12px;align-items:center}
.who2 .av2{width:36px;height:36px;border-radius:50%;background:var(--secondary-c);color:var(--on-secondary-c);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who2 .sub{display:block;font-size:12px;color:var(--on-variant)}
.rt{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:8px;background:var(--surface-hi);border:1px solid var(--outline-v)}
.aico{width:32px;height:32px;border-radius:9px;flex:none;object-fit:contain}
.aico.ph{display:grid;place-items:center;background:var(--surface-hi);border:1px solid var(--outline-v);color:var(--on-variant);font-weight:700;font-size:13px}
.applist small{display:block;color:var(--on-variant);font-size:11.5px;direction:ltr;text-align:right}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--warn-c);color:var(--warn)}
.note.err{background:var(--error-c);color:var(--on-error-c)}
.note.ok{background:var(--primary-c);color:var(--on-primary-c)}
.note.info{background:var(--surface-hi);color:var(--on-variant)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--on-variant)}
.kv dd{margin:0;overflow-wrap:anywhere}
.bigcode{font-size:34px;font-weight:700;letter-spacing:6px;direction:ltr;text-align:center;color:var(--primary)}
.bigcode.long{font-size:clamp(22px,7vw,30px);letter-spacing:2px;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;margin-bottom:12px}
.login{max-width:400px;margin:8vh auto 0;padding:0 16px}
.login .brandbig{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.login .brandbig img{width:72px;height:72px;border-radius:18px}
.login .brandbig b{font-size:24px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--on);color:var(--surface);padding:12px 18px;border-radius:10px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
dialog{border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--on);max-width:min(480px,calc(100vw - 32px));width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .in{padding:22px}
dialog h3{font-size:19px;margin-bottom:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rowact{width:1%;white-space:nowrap;text-align:left}
.bulkdel{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px dashed var(--line,#ddd);border-radius:12px}
@media (max-width:720px){ table.cards td.rowact{text-align:start} table.cards td.rowact:empty{display:none} }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<section id="loginView" class="login" hidden>
  <div class="brandbig"><img src="icon.webp" alt=""><b>קיידרואיד</b><span class="muted">מערכת הניהול למתקינים</span></div>
  <form class="card" id="loginForm"><div class="bd">
    <div class="field"><label class="f" for="lEmail">מייל</label><input id="lEmail" type="email" autocomplete="username" dir="ltr" required></div>
    <div class="field"><label class="f" for="lPass">סיסמה</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></div>
    <button class="btn fill" style="width:100%" type="submit">כניסה</button>
    <p class="err" id="loginErr" style="margin:12px 0 0"></p>
    <p style="margin:10px 0 0;text-align:center"><button class="btn text sm" type="button" id="forgotBtn">שכחתי סיסמה</button></p>
  </div></form>
</section>

<div id="appView" hidden>
  <div class="mtop"><button class="mb" id="navBtn" aria-label="תפריט"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <img src="icon.webp" alt=""><b>קיידרואיד</b></div>
  <div class="shell">
    <aside class="side" aria-label="ניווט">

// ---------------------------------------------------------------- firestore REST (plain requests: works behind filtering)
async function tok(){ return auth.currentUser.getIdToken(); }
function val(v){ if(!v) return null; if("stringValue" in v) return v.stringValue; if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return v.doubleValue; if("booleanValue" in v) return v.booleanValue;
  if("mapValue" in v){ const o={}; for(const k in (v.mapValue.fields||{})) o[k]=val(v.mapValue.fields[k]); return o; } return null; }
function decode(doc){ const o={_id:decodeURIComponent(doc.name.split("/").pop())}; for(const k in (doc.fields||{})) o[k]=val(doc.fields[k]); return o; }
function encode(o){ const f={}; for(const k in o){ const v=o[k]; if(v===undefined) continue;
  if(typeof v==="boolean") f[k]={booleanValue:v}; else if(typeof v==="number"&&Number.isInteger(v)) f[k]={integerValue:String(v)};
  else if(typeof v==="number") f[k]={doubleValue:v};
  else if(v&&typeof v==="object") f[k]={mapValue:{fields:encode(v)}};
  else f[k]={stringValue:String(v==null?"":v)}; } return f; }
async function req(method,url,body){
  const r=await fetch(url,{method,headers:{Authorization:"Bearer "+await tok(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error((j.error&&j.error.message)||("http "+r.status)); e.code=r.status; throw e; }
  return j;
}
async function getDoc(path){ try{ return decode(await req("GET",FS+"/"+path.split("/").map(encodeURIComponent).join("/"))); }catch(e){ if(e.code===404) return null; throw e; } }
async function listAll(col){
  const out=[]; let pt="";
  do{ const j=await req("GET",FS+"/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):""));
      (j.documents||[]).forEach(d=>out.push(decode(d))); pt=j.nextPageToken||""; }while(pt);
  return out;
}
async function query(col,field,value){
  const j=await req("POST",FS+":runQuery",{structuredQuery:{from:[{collectionId:col}],
    where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:value}}},limit:500}});
  return j.filter(x=>x.document).map(x=>decode(x.document));
}
async function commit(writes){
  await req("POST",FS+":commit",{writes:writes.map(w=>{
    if(w.del) return {delete:DOCS+"/"+w.del};
    const o={update:{name:DOCS+"/"+w.set,fields:encode(w.data)}};
    if(w.mask) o.updateMask={fieldPaths:w.mask};
    if(w.create) o.currentDocument={exists:false};
    if(w.exists) o.currentDocument={exists:true};
    return o; })});
  typing=false; // a saved form is done; let the page refresh again
}

async function load(){

    const own=me.role==="owner";

      own?listAll("devices"):query("devices","installerId",me.uid),
      own?listAll("reports"):query("reports","installerId",me.uid),
      own?listAll("requests"):query("requests","installerId",me.uid)]);
    D.devices=devs.filter(d=>d.status); D.reports=Object.fromEntries(reps.map(r=>[r._id,r])); D.requests=reqs.sort((a,b)=>b.createdAt-a.createdAt);
    if(own){
      const [msgs,insts,pub,prof]=await Promise.all([listAll("messages"),listAll("installers"),getDoc("config/public"),getDoc("config/ownerProfile")]);
      D.messages=msgs.sort((a,b)=>b.createdAt-a.createdAt); D.installers=insts; D.config=pub||{}; D.ownerProfile=prof?parse(prof.json):null;
      backfillCodeProfiles(); ensureReleasePool(); ensurePublicStock(); loadPublicLog();
    }
    else{
      D.config=(await getDoc("config/public").catch(()=>null))||{};
      const inst=await getDoc("installers/"+me.uid).catch(()=>null);
      if(inst){ me.canRelease=inst.canRelease!==false; me.canDelete=inst.canDelete===true; }
    }
    loaded=true;
  }catch(e){ console.error(e); toast("לא הצלחתי לטעון נתונים מהשרת."); }
  loading=false; if(!draft&&!typing) render(); else renderTabs();
}

/** installers who saved a default profile before installing phones could read it: copy it onto their code, once */
let backfilled=false;
async function backfillCodeProfiles(){
  if(backfilled) return; backfilled=true;
  try{
    const codes=Object.fromEntries((await listAll("installerCodes")).map(c=>[c._id,c]));
    const w=D.installers.filter(i=>i.active&&i.defaultProfile&&codes[i.code]&&codes[i.code].profile!==i.defaultProfile)
      .map(i=>({set:"installerCodes/"+i.code,data:{profile:i.defaultProfile},mask:["profile"],exists:true}));
    if(w.length) await commit(w);
  }catch(e){ console.warn("backfill",e); }
}

}

// ---------------------------------------------------------------- overview
/** the public download page, and an installer's personal link to it */
const siteUrl = code => new URL("../download/"+(code?"?i="+code:""), location.href).href;
async function copyText(t,ok){ try{ await navigator.clipboard.writeText(t); toast(ok||"הועתק"); }catch(e){ prompt("העתיקו:",t); } }
const tile = (href,ic,val,label,alert) => `<a class="tile ${alert?"alert":""}" href="${href}"><div class="ti">${icon(ic)}</div><div><div class="v num">${val}</div><div class="l">${label}</div></div></a>`;
function linkCard(){
  const own=me.role==="owner", f=D.config.features||{}, linksOn=f.links!==false, siteOn=f.site!==false;
  const url=own?siteUrl(""):siteUrl(me.code);
  if(!own&&!linksOn) return `<section class="card"><div class="hd">${icon("link")}<h2>הקישור האישי שלך</h2></div><div class="bd"><div class="note info">הקישורים האישיים כבויים כרגע על ידי מנהל המערכת.</div></div></section>`;
  return `<section class="card"><div class="hd">${icon("link")}<h2>${own?"אתר ההורדה הציבורי":"הקישור האישי שלך"}</h2>
      ${own?`<span class="pill ${siteOn?"active":"released"}">${siteOn?"פתוח":"סגור"}</span>`:""}</div><div class="bd">
    <p class="muted" style="margin-top:0">${own?"מכאן כל אחד יכול להתקין לבד. המכשירים מגיעים אליך כמוקד.":"מי שמתקין דרך הקישור הזה מתחבר אליך: המכשיר מופיע אצלך, עם ברירת המחדל שלך."}</p>
    <div class="linkbox"><span dir="ltr">${esc(url)}</span><button class="btn tonal sm" data-copy="${esc(url)}">${icon("copy")}העתק</button></div>
    ${own?"":`<div class="muted" style="margin-top:10px">קוד המתקין שלך: <b class="num" style="letter-spacing:2px">${esc(me.code)}</b> · למי שמתקין בלי הקישור</div>`}
  </div></section>`;
}
function vOverview(v){
  const act=D.devices.filter(d=>d.status==="active").length, pend=D.devices.filter(d=>d.status==="pending").length;
  const stale=D.devices.filter(isStale), reqs=openRequests(), att=attention(), own=me.role==="owner";
  const pf=D.publicFree;
  const stockAlert = own&&pf!=null&&pf<PUBLIC_LOW ? `<a class="note ${pf===0?"err":"warn"}" href="#install" style="display:block;text-decoration:none;color:inherit">
    <b>${pf===0?"מלאי ההורדה הציבורית נגמר.":"מלאי ההורדה הציבורית עומד להיגמר ("+pf+" נשארו)."}</b>
    ${pf===0?"מי שמוריד עכשיו מקבל קובץ שדורש אינטרנט פעם אחת בנעילה.":""} השאירו את הפאנל פתוח כדי שהמלאי יתמלא.</a>` : "";
  v.innerHTML=`<div class="grid">
    ${stockAlert}
    <div class="tiles">
      ${tile("#devices","shield",act,"מכשירים מוגנים")}
      ${tile("#devices","phone",pend,"ממתינים להפעלה",pend)}
      ${tile("#requests","inbox",reqs.length,"בקשות פתוחות",reqs.length)}
      ${tile("#devices","alert",stale.length,"לא התחברו 3 ימים ומעלה",stale.length)}
    </div>
    <div class="split">
      <div class="grid">
        <section class="card"><div class="hd"><h2>בקשות פתוחות</h2><span class="spacer"></span><a class="btn text sm" href="#requests">לכל הבקשות</a></div>
          <div class="list">${reqs.slice(0,6).map(reqItem).join("")||'<div class="empty">אין בקשות פתוחות</div>'}</div></section>
        <section class="card"><div class="hd"><h2>דורשים תשומת לב</h2></div>
          <div class="list">${att.map(d=>`<a class="item" style="text-decoration:none;color:inherit" href="#device/${encodeURIComponent(d._id)}">
            <div class="main"><div class="t">${esc(d.name)}</div><div class="muted">${esc(d.why)}</div></div>${pill(statusOf(d))}</a>`).join("")||'<div class="empty">הכל תקין</div>'}</div></section>
      </div>
      <div class="grid">${linkCard()}
        ${own?`<section class="card"><div class="hd"><h2>מלאי ההורדה הציבורית</h2><span class="spacer"></span><a class="btn text sm" href="#install">פרטים</a></div><div class="bd">
          <div class="v num" style="font-size:28px;font-weight:700">${pf==null?"…":pf}<span class="muted" style="font-size:14px;font-weight:500"> מתוך ${PUBLIC_TARGET}</span></div>
          <div class="bar"><i style="width:${pf==null?0:Math.min(100,Math.round(pf*100/PUBLIC_TARGET))}%"></i></div></div></section>`:""}
      </div>
    </div></div>`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-copy]"); if(b) copyText(b.dataset.copy,"הקישור הועתק"); });
function attention(){
  const out=[];
  D.devices.forEach(d=>{
    const st=stateOf(d._id), x=w=>out.push(Object.assign({why:w},d));
    if(d.status==="pending") x((isReturning(d)?"מכשיר שהיה רשום בעבר · ":"")+"נרשם "+ago(d.createdAt)+", ממתין להפעלה");
    else if(d.status==="released") return;
    else if(isStale(d)) x("לא התחבר "+ago(lastSeen(d._id)));
    else if(issuesOf(d._id).length) x("בעיה ב"+issuesOf(d._id).map(i=>i.l||i.p).join(", ")+": האפליקציה לא תתחבר לרשת");
    else if(st&&st.lastErr) x("שגיאה במכשיר: "+st.lastErr);
    else if(st&&st.owner===false) x("האפליקציה אינה מנהלת את המכשיר");
  });
  return out.slice(0,8);
}
function reqItem(r){
  const d=devById(r.deviceId)||{name:"מכשיר לא ידוע"};
  return `<div class="item"><div class="badgeicon" style="background:var(--warn-c);color:var(--warn)">${icon(r.type==="activate"?"shield":"edit")}</div>
    <div class="main"><div class="t">${esc(REQ_TYPE[r.type]||r.type)} · ${esc(d.name)}</div>
      <div class="muted">${when(r.createdAt)}${me.role==="owner"?" · "+esc(installerLabel(r.installerId)):""}</div>
      ${r.text?`<div class="x">${esc(r.text)}</div>`:""}</div>
    <div class="row">${r.status==="open"?`<a class="btn fill sm" href="#device/${encodeURIComponent(r.deviceId)}">טיפול</a>
      <button class="btn out sm" data-reject="${esc(r._id)}">דחה</button>`:`<span class="pill ${r.status==="approved"?"active":"released"}">${r.status==="approved"?"אושרה":"נדחתה"}</span>`}</div></div>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-reject]"); if(!b) return;
  const r=D.requests.find(x=>x._id===b.dataset.reject); if(!r) return;
  b.disabled=true;
  try{ await commit([{set:"requests/"+r._id,data:{status:"rejected",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]},
                     audit(r.deviceId,"request_rejected",REQ_TYPE[r.type])]);
       toast("הבקשה נדחתה"); load(); }catch(err){ toast("הפעולה נכשלה"); b.disabled=false; }
});

// ---------------------------------------------------------------- devices
let devFilter="all", devSearch="";
function vDevices(v){
  const f={all:"הכל",pending:"ממתינים להפעלה",active:"מוגנים",stale:"לא מתחברים",released:"שוחררו"};
  const cnt={all:D.devices.length,stale:D.devices.filter(isStale).length};
  ["pending","active","released"].forEach(k=>cnt[k]=D.devices.filter(d=>d.status===k).length);
  v.innerHTML=`<section class="card"><div class="bd">
    <div class="toolbar"><input type="search" id="q" placeholder="חיפוש לפי שם, טלפון או דגם" value="${esc(devSearch)}" aria-label="חיפוש">
      <div class="chips">${Object.entries(f).map(([k,t])=>`<button class="chip ${devFilter===k?"on":""}" data-f="${k}">${t}<span class="cn">${cnt[k]}</span></button>`).join("")}</div></div>
    <div class="tablewrap"><table class="cards devs"><thead><tr><th>מכשיר</th><th>טלפון</th>${me.role==="owner"?"<th>מתקין</th>":""}<th>מצב</th><th>מסלול</th><th>נראה לאחרונה</th><th>גרסה</th>${me.canDelete?'<th aria-label="פעולות"></th>':""}</tr></thead>
    <tbody id="devRows"></tbody></table></div><div id="devEmpty" class="empty" hidden>לא נמצאו מכשירים</div>
    ${me.canDelete&&devFilter==="released"&&cnt.released>1?`<div class="bulkdel"><span class="muted">מכשירים ששוחררו כבר לא מסוננים. אפשר למחוק אותם מהרשימה.</span><button class="btn danger sm" id="delAllReleased">מחק את כל ${cnt.released} המשוחררים</button></div>`:""}</div></section>`;
  const draw=()=>{
    const q=devSearch.trim();
    const rows=D.devices.filter(d=>{
      if(q && !(String(d.name).includes(q)||String(d.phone).includes(q)||String(modelOf(d)).toLowerCase().includes(q.toLowerCase()))) return false;
      if(devFilter==="stale") return isStale(d);
      return devFilter==="all"||d.status===devFilter;
    }).sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||(b.createdAt||0)-(a.createdAt||0));
    $("devRows").innerHTML=rows.map(d=>{const st=stateOf(d._id)||{}, pol=parse(d.policy)||{}, iss=issuesOf(d._id), mode=pol.filter_mode||st.filter_mode;
      return `<tr class="click" data-go="${encodeURIComponent(d._id)}">
      <td class="nm"><div class="who2"><span class="av2">${esc(initialsOf(d.name))}</span><span><b>${esc(d.name)}</b>${isReturning(d)?' <span class="pill wait" title="המכשיר הזה כבר היה רשום במערכת בעבר">חוזר</span>':""}
        ${modelOf(d)?`<span class="sub" dir="auto">${esc(modelOf(d))}</span>`:""}</span></div></td>
      <td class="num" dir="ltr" style="text-align:right" data-l="טלפון">${esc(d.phone)}</td>${me.role==="owner"?`<td data-l="מתקין">${esc(installerLabel(d.installerId))}</td>`:""}
      <td data-l="מצב">${pill(statusOf(d))}${iss.length?' <span class="pill pending" title="'+esc(iss.map(issueText).join("\n"))+'">⚠ '+(iss.length===1?'בעיה אחת':iss.length+' בעיות')+'</span>':""}</td>
      <td data-l="מסלול">${mode?`<span class="rt">${esc(MODE_NAME[mode]||mode)}</span>`:"—"}</td>
      <td data-l="נראה לאחרונה">${ago(lastSeen(d._id))}</td><td class="num" data-l="גרסה">${esc(st.appVersion||d.appVersion||"")}</td>${me.canDelete?`<td class="rowact">${d.status==="released"?`<button class="btn danger sm" data-del="${esc(d._id)}" title="מחיקה מהמערכת">מחק</button>`:""}</td>`:""}</tr>`;}).join("");
    $("devEmpty").hidden=rows.length>0;
  };
  draw();
  $("q").oninput=e=>{devSearch=e.target.value; draw();};
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{devFilter=b.dataset.f; vDevices(v);});
  $("devRows").onclick=e=>{
    const del=e.target.closest("[data-del]");
    if(del){ e.stopPropagation(); const d=devById(del.dataset.del); if(!d) return;
      confirmDlg("מחיקת "+(d.name||"המכשיר"),"המכשיר שוחרר ויימחק מהרשימה. אפשר לרשום אותו שוב בהתקנה חדשה.","מחק",async()=>{
        try{ await deleteDevices([d]); toast("המכשיר נמחק"); load(); }catch(err){ toast("המחיקה נכשלה"); } });
      return; }
    const tr=e.target.closest("tr[data-go]"); if(tr) location.hash="#device/"+tr.dataset.go;};
  if($("delAllReleased")) $("delAllReleased").onclick=()=>{ const list=D.devices.filter(d=>d.status==="released");
    confirmDlg("מחיקת כל המכשירים ששוחררו",`${list.length} מכשירים ששוחררו יימחקו מהרשימה. אפשר לרשום כל אחד מהם שוב בהתקנה חדשה.`,"מחק הכל",async()=>{
      try{ await deleteDevices(list); toast("נמחקו "+list.length+" מכשירים"); load(); }catch(err){ toast("המחיקה נכשלה"); } }); };
}
// delete from the system: the device record, its report and (owner) its secret; up to 100 devices per request
async function deleteDevices(list){
  for(let i=0;i<list.length;i+=100){
    const w=[]; list.slice(i,i+100).forEach(d=>{ w.push({del:"devices/"+d._id},{del:"reports/"+d._id},audit(d._id,"deleted",d.name)); if(me.role==="owner") w.push({del:"deviceSecrets/"+d._id}); });
    await commit(w);
  }
}
const initialsOf = n => { const w=String(n||"?").trim().split(/\s+/); return (w[0]||"?").charAt(0)+(w[1]?w[1].charAt(0):""); };

// ---------------------------------------------------------------- device page
function vDevice(id){
  const v=$("view"), d=devById(id);
  if(!d){ v.innerHTML='<a class="back" href="#devices">'+icon("back")+' חזרה למכשירים</a><div class="empty">המכשיר לא נמצא</div>'; return; }
  const st=stateOf(id)||{}, apps=appsOf(id), s=statusOf(d), myReqs=D.requests.filter(r=>r.deviceId===id);
  const openReq=myReqs.find(r=>r.status==="open");
  if(draft&&draft.id!==id) draft=null;
  const pol = draft ? draft.p : currentPolicy(d);
  const mark=()=>{ if(!draft) draft={id,p:JSON.parse(JSON.stringify(pol))}; return draft.p; };
  const warn=[];
  if(st.owner===false) warn.push("האפליקציה אינה מנהלת את המכשיר, ולכן שינויים לא יוחלו בו.");
  issuesOf(id).forEach(i=>warn.push(issueText(i)));
  if(st.lastErr) warn.push("שגיאה אחרונה במכשיר: "+st.lastErr);
  if(isStale(d)) warn.push("המכשיר לא התחבר "+ago(lastSeen(id))+". השינויים יוחלו כשיתחבר.");
  const earlier=earlierOf(d);
  const returningNote = earlier.length ? `<div class="note warn" style="margin-bottom:14px"><b>${isReturning(d)?"המכשיר הזה כבר היה רשום במערכת בעבר":"המכשיר הזה נרשם שוב מאוחר יותר"}</b>
    ${earlier.map(x=>`<div style="margin-top:6px">${isReturning(d)&&(x.createdAt||0)<(d.createdAt||0)?"הרשמה קודמת":"הרשמה נוספת"}: <a href="#device/${encodeURIComponent(x._id)}">${esc(x.name)}</a>
      · ${esc(x.phone||"")} · ${esc(statusOf(x).t)}${me.role==="owner"?" · "+esc(installerLabel(x.installerId)):""} · נרשם ${when(x.createdAt)}</div>`).join("")}</div>` : "";
  const primaryLabel = d.status==="active" ? "שמור והחל במכשיר" : "אשר והפעל את הסינון";

  v.innerHTML=`<a class="back" href="#devices">${icon("back")} חזרה למכשירים</a>
  <div class="split">
    <div class="grid">
      <section class="card"><div class="hd"><h2>${esc(d.name)}</h2>${pill(s)}<span class="spacer"></span>${draft?'<span class="muted">יש שינויים שלא נשמרו</span>':""}</div>
        <div class="bd">
          ${returningNote}
          ${openReq?`<div class="note warn" style="margin-bottom:14px"><b>${esc(REQ_TYPE[openReq.type])}</b> · ${when(openReq.createdAt)}${openReq.text?"<br>"+esc(openReq.text):""}</div>`:""}
          ${warn.map(w=>`<div class="note err" style="margin-bottom:10px">${esc(w)}</div>`).join("")}
          ${d.status==="released"?`<div class="note info">המכשיר שוחרר ואינו מנוהל יותר.</div>`:`
          ${d.status==="pending"?`<div class="note info" style="margin-bottom:14px">כך יוגדר המכשיר כשתאשרו. ${d.legacy?"ההגנה כבר פעילה במכשיר מהתקנה קודמת, והאישור יעביר אותו לניהול שלכם.":"עד האישור, הסינון אינו פעיל במכשיר."}</div>`:""}
          <h3 style="font-size:15px;margin-bottom:10px">מסלול</h3>
          ${MODES.map(m=>`<label class="opt ${pol.filter_mode===m.v?"on":""}"><input type="radio" name="mode" value="${m.v}" ${pol.filter_mode===m.v?"checked":""}><span><b>${m.t}</b><span class="muted">${esc(m.d)}</span></span></label>`).join("")}
          <h3 style="font-size:15px;margin:18px 0 4px">הגדרות</h3>
          ${SETTINGS.map(([k,t])=>`<div class="sw"><span>${t}</span><label class="toggle"><input type="checkbox" data-k="${k}" ${pol.settings[k]?"checked":""} aria-label="${t}"><i></i></label></div>
            ${k==="disable_sensible_apps"&&pol.settings[k]?sensBlock(pol,apps):""}`).join("")}
          <div class="row" style="margin-top:18px">
            <button class="btn fill" id="saveBtn">${primaryLabel}</button>
            ${draft?'<button class="btn text" id="undoBtn">בטל שינויים</button>':""}
            <span class="spacer"></span>
          </div>`}
        </div></section>
      <section class="card"><div class="hd"><h2>היסטוריית בקשות</h2></div>
        <div class="list">${myReqs.map(reqItem).join("")||'<div class="empty">אין בקשות מהמכשיר</div>'}</div></section>
    </div>
    <div class="grid">
      <section class="card"><div class="hd"><h2>פרטים</h2></div><div class="bd"><dl class="kv">
        <dt>טלפון</dt><dd class="num" dir="ltr" style="text-align:right">${esc(d.phone)}</dd>
        ${d.email?`<dt>מייל</dt><dd dir="ltr" style="text-align:right">${esc(d.email)}</dd>`:""}
        <dt>מתקין</dt><dd>${esc(installerLabel(d.installerId))}</dd>
        <dt>נרשם</dt><dd>${when(d.createdAt)}</dd>
        ${d.lockedAt?`<dt>ננעל בהתקנה</dt><dd>${when(d.lockedAt)}</dd>`:""}
        ${d.fid?`<dt>הותקן מקובץ</dt><dd class="num">${esc(d.fid)}</dd>`:""}
        <dt>נראה לאחרונה</dt><dd>${ago(lastSeen(id))}</dd>
        <dt>גרסה</dt><dd class="num">${esc(st.appVersion||d.appVersion||"—")}</dd>
        ${modelOf(d)?`<dt>דגם</dt><dd dir="ltr" style="text-align:right">${esc(modelOf(d))}</dd>`:""}
        <dt>הגנה במכשיר</dt><dd>${st.protected?"פעילה":"לא פעילה"}</dd>
      </dl>

      </div></section>
      <section class="card"><div class="hd"><h2>פעולות</h2></div><div class="acts">
        ${me.role==="owner"?`<div class="act"><div class="main"><b>העברה למתקין אחר</b><span class="muted">המכשיר, הבקשות והדיווחים עוברים אליו</span>
          <div class="row" style="margin-top:8px"><select id="reassign" style="flex:1"><option value="owner">${esc(D.config.ownerName||"מוקד קיידרואיד")} (אני)</option>
          ${D.installers.filter(i=>i.active).map(i=>`<option value="${esc(i._id)}" ${d.installerId===i._id?"selected":""}>${esc(i.name)}</option>`).join("")}</select><button class="btn out sm" id="reassignBtn">העבר</button></div></div></div>
          <div class="act"><div class="main"><b>חסימת פניות</b><span class="muted">המשתמש לא יוכל לשלוח לך הודעות מהאפליקציה</span></div>
            <label class="toggle"><input type="checkbox" id="msgBlk" ${d.msgBlocked?"checked":""} aria-label="חסום פניות"><i></i></label></div>`:""}
        ${d.status!=="released"?`<div class="act danger"><div class="main"><b>שחרור המכשיר</b><span class="muted">${me.canRelease?"הסינון יוסר מהמכשיר כשיתחבר, והמשתמש יוכל להסיר את קיידרואיד. אי אפשר לבטל.":"שחרור מכשירים מתבצע על ידי מנהל המערכת."}</span></div>
          ${me.canRelease?`<button class="btn danger sm" id="releaseBtn">שחרר</button>`:""}</div>`:""}
        <div class="act danger"><div class="main"><b>מחיקה מהמערכת</b><span class="muted">${me.canDelete?"המכשיר נמחק מהפאנל. הסינון בו ממשיך לפעול, אבל לא תוכלו לשלוט בו מרחוק.":"רק מנהל המערכת יכול למחוק מכשירים."}</span></div>
          ${me.canDelete?`<button class="btn danger sm" id="deleteBtn">מחק</button>`:""}</div>
      </div></section>
      ${d.status!=="released"?`<section class="card"><div class="hd">${icon("key")}<h2>קוד חירום</h2></div><div class="bd">
        <p class="muted" style="margin-top:0">כשאין למכשיר אינטרנט: בקשו מהמשתמש את המספר שמופיע אצלו במסך "קוד חירום".</p>
        <div class="field"><label class="f" for="chal">המספר מהמכשיר</label><input type="text" id="chal" inputmode="numeric" dir="ltr" placeholder="8 ספרות" class="num"></div>
        <div class="field"><label class="f" for="emAct">מה לאשר</label><select id="emAct">${EMERG.filter(([k])=>k!=="release"||me.canRelease).map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></div>

// app icons: uploaded by devices once per package (appIcons/{pkg}); read in one batch per screen
const ICONS={};
const appIcon = a => ICONS[a.p] ? `<img class="aico" src="${ICONS[a.p]}" alt="">`
  : `<span class="aico ph" data-icon="${esc(a.p)}" aria-hidden="true">${esc(String(a.l||a.p).trim().charAt(0))}</span>`;
let iconBusy=false;
async function fillIcons(){
  if(iconBusy) return;
  const want=[...new Set([...document.querySelectorAll("[data-icon]")].map(e=>e.dataset.icon))].filter(p=>!(p in ICONS));
  if(!want.length) return; iconBusy=true;
  try{
    for(let i=0;i<want.length;i+=100){
      const part=want.slice(i,i+100);
      const j=await req("POST",FS+":batchGet",{documents:part.map(p=>DOCS+"/appIcons/"+p)});
      j.forEach(r=>{ if(r.found){ const d=decode(r.found); ICONS[d._id]=d.png?"data:image/png;base64,"+d.png:""; } else if(r.missing){ ICONS[r.missing.split("/").pop()]=""; } });
    }
    document.querySelectorAll("[data-icon]").forEach(e=>{ const u=ICONS[e.dataset.icon]; if(u){ const im=document.createElement("img"); im.className="aico"; im.src=u; im.alt=""; e.replaceWith(im); } });
  }catch(e){ console.warn("icons",e); }
  iconBusy=false;
}
function sensBlock(pol,apps){

const AUDIT={msg_blocked:"חסימת פניות",msg_unblocked:"ביטול חסימת פניות",policy_saved:"עדכון מסלול והגדרות",activated:"הפעלת הסינון",released:"שחרור המכשיר",request_rejected:"דחיית בקשה",emergency_code:"יצירת קוד חירום",reassigned:"העברה למתקין",deleted:"מחיקה",permission:"שינוי הרשאת מתקין",install_file:"הורדת קובץ התקנה",offline_code:"קוד חירום בלי אינטרנט"};
const auditText = a => (AUDIT[a.action]||a.action)+(a.detail?": "+a.detail:"");
const policySummary = p => (MODE_NAME[p.filter_mode]||"")+" · "+SETTINGS.filter(([k])=>p.settings[k]).length+" הגבלות";

async function savePolicy(d,pol,openReq){
  const b=$("saveBtn"); b.disabled=true; b.textContent="שומר…";
  const st=stateOf(d._id)||{};
  const rev=Math.max(Date.now(),(d.rev||0)+1,(st.appliedRev||0)+1);
  const payload={filter_mode:pol.filter_mode,settings:pol.settings}; if(Array.isArray(pol.hiddenApps)) payload.hiddenApps=pol.hiddenApps;
  const inst = d.installerId==="owner" ? {name:D.config.ownerName||"",phone:D.config.ownerPhone||""}
             : (me.role==="installer" ? {name:me.name,phone:me.phone} : (D.installers.find(i=>i._id===d.installerId)||{}));
  const activating = d.status!=="active";
  const w=[{set:"devices/"+d._id,data:{status:"active",policy:JSON.stringify(payload),rev,installerName:inst.name||"",installerPhone:inst.phone||"",updatedAt:Date.now(),updatedBy:me.uid},
            mask:["status","policy","rev","installerName","installerPhone","updatedAt","updatedBy"]},
           audit(d._id,activating?"activated":"policy_saved",policySummary(pol))];
  if(openReq&&openReq.type!=="remove") w.push({set:"requests/"+openReq._id,data:{status:"approved",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]});
  try{ await commit(w); draft=null; toast(activating?"הסינון אושר. הוא יופעל במכשיר בדקות הקרובות.":"נשמר. המכשיר יקבל את השינוי בדקות הקרובות."); await load(); }
  catch(e){ toast("השמירה נכשלה: "+e.message); b.disabled=false; b.textContent="נסו שוב"; }
}
function releaseDevice(d,openReq){
  confirmDlg("שחרור המכשיר","הסינון יוסר מהמכשיר של "+d.name+", והמשתמש יוכל להסיר את קיידרואיד. אי אפשר לבטל את הפעולה מרחוק.","שחרר",async()=>{
    const w=[{set:"devices/"+d._id,data:{status:"released",rev:Math.max(Date.now(),(d.rev||0)+1),updatedAt:Date.now(),updatedBy:me.uid},mask:["status","rev","updatedAt","updatedBy"]},
             audit(d._id,"released",d.name)];
    if(openReq) w.push({set:"requests/"+openReq._id,data:{status:"approved",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]});
    await commit(w); draft=null; toast("המכשיר ישוחרר כשיתחבר"); load();
  },d.name);
}
async function hmacCode(secret,ch,act){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey("raw",enc.encode(secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const b=new Uint8Array(await crypto.subtle.sign("HMAC",k,enc.encode(ch+"|"+act)));
  const n=((b[0]&0x7f)<<24)|(b[1]<<16)|(b[2]<<8)|b[3];
  return String(n%1000000).padStart(6,"0");
}

/** Moves a device to another installer (owner only). The device's report and open requests move with it. */
async function reassign(d,to){
  const inst=D.installers.find(i=>i._id===to);
  const w=[{set:"devices/"+d._id,data:{installerId:to,installerName:inst?inst.name:(D.config.ownerName||""),installerPhone:inst?inst.phone:(D.config.ownerPhone||"")},mask:["installerId","installerName","installerPhone"]}];
  if(D.reports[d._id]) w.push({set:"reports/"+d._id,data:{installerId:to},mask:["installerId"],exists:true});
  D.requests.filter(r=>r.deviceId===d._id&&r.status==="open").forEach(r=>w.push({set:"requests/"+r._id,data:{installerId:to},mask:["installerId"]}));
  w.push(audit(d._id,"reassigned","אל "+installerLabel(to)));
  await commit(w);
}

// ---------------------------------------------------------------- install files (personal installer per installer)
// One signed app for everyone. When a file is downloaded, the installer's details are written into the APK Signing
// Block, an area the signature does not cover, so the app stays validly signed and nothing is built per installer.
// The file also carries the END of a one-way chain per emergency action; the chain STARTS stay here in the panel.
const RAW = "https://raw.githubusercontent.com/EliyahuHillel/kdroid-updates/main/";
const CH_N = 20, CH_ROUNDS = 120000, CH_MOD = 1000000000000n;
const ROUTE_ACTS = ["KosherMode","NavigationMode","NavigationMailMode"];
const fmt12 = x => (BigInt(x) % CH_MOD).toString().padStart(12,"0");
const group12 = s => s.replace(/(\d{4})(?=\d)/g,"$1 ");
async function chainStep(x,sid,act,i){
  const e=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",e.encode(fmt12(x)),"PBKDF2",false,["deriveBits"]);
  const b=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:e.encode("kiyd|"+sid+"|"+act+"|"+i),iterations:CH_ROUNDS},key,64));
  let v=0n; for(let j=0;j<8;j++) v=(v<<8n)|BigInt(b[j]);
  return (v & ((1n<<63n)-1n)) % CH_MOD;
}
async function chainTip(seed,sid,act){ let x=BigInt(seed); for(let i=0;i<CH_N;i++) x=await chainStep(x,sid,act,i); return x; }
/** the code a phone accepts as its k-th code (1-based, as shown on the phone) for this action */
async function chainCode(seed,sid,act,k){ let x=BigInt(seed); for(let i=0;i<CH_N-k;i++) x=await chainStep(x,sid,act,i); return x; }
function randomSeed(){ const b=crypto.getRandomValues(new Uint8Array(8)); let v=0n; b.forEach(x=>v=(v<<8n)|BigInt(x)); return v % CH_MOD; }

/** owner: keep a stock of release chains, so installers can make files without ever holding a release seed */
async function makeReleaseChain(){
  const rid=newId(), seed=randomSeed(), tip=await chainTip(seed,rid,"release");
  await commit([{set:"releaseSeeds/"+rid,create:true,data:{seed:fmt12(seed)}},
                {set:"releaseTips/"+rid,create:true,data:{tip:fmt12(tip),fid:"",installerId:"",createdAt:Date.now()}}]);
}
let poolBusy=false;
async function ensureReleasePool(){
  if(me.role!=="owner"||poolBusy) return; poolBusy=true;
  try{ const free=await query("releaseTips","fid",""); for(let n=free.length;n<30;n++) await makeReleaseChain(); }
  catch(e){ console.warn("pool",e); }
  poolBusy=false;
}

const PAD_ID=0x42726577, KIY_ID=0x4b445931;
/** writes the installer block into the APK Signing Block; keeps the block 4096-aligned like apksigner does */
function injectApk(u8,payload){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eocd=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(u8[i]===0x50&&u8[i+1]===0x4b&&u8[i+2]===5&&u8[i+3]===6){eocd=i;break;} }
  if(eocd<0) throw new Error("not an apk");
  const cd=dv.getUint32(eocd+16,true);
  if(new TextDecoder().decode(u8.subarray(cd-16,cd))!=="APK Sig Block 42") throw new Error("unsigned apk");
  const sz=Number(dv.getBigUint64(cd-24,true)), st=cd-sz-8;
  const pairs=[]; let o=st+8;
  while(o<cd-24){ const l=Number(dv.getBigUint64(o,true)), id=dv.getUint32(o+8,true);
    if(id!==PAD_ID&&id!==KIY_ID) pairs.push([id,u8.subarray(o+12,o+8+l)]); o+=8+l; }
  pairs.push([KIY_ID,new TextEncoder().encode(payload)]);
  let body=pairs.reduce((a,[,v])=>a+12+v.length,0);
  const pad=(4096-((8+body+8+16+12)%4096))%4096; body+=12+pad;
  const nsz=body+24, blk=new Uint8Array(nsz+8), b=new DataView(blk.buffer);
  b.setBigUint64(0,BigInt(nsz),true); let p=8;
  for(const [id,v] of pairs){ b.setBigUint64(p,BigInt(v.length+4),true); b.setUint32(p+8,id,true); blk.set(v,p+12); p+=12+v.length; }
  b.setBigUint64(p,BigInt(pad+4),true); b.setUint32(p+8,PAD_ID,true); p+=12+pad;
  b.setBigUint64(p,BigInt(nsz),true); blk.set(new TextEncoder().encode("APK Sig Block 42"),p+8);
  const tail=u8.slice(cd); new DataView(tail.buffer).setUint32(eocd-cd+16,st+blk.length,true);
  return new Blob([u8.subarray(0,st),blk,tail],{type:"application/vnd.android.package-archive"});
}

/** a file from this site, with progress; falls back to GitHub's raw server */
async function fetchFile(path,onPct){
  let last;
  for(const u of ["../"+path+"?t="+Date.now(), RAW+path+"?t="+Date.now()]){
    try{
      const r=await fetch(u,{cache:"no-store"}); if(!r.ok){ last=new Error("http "+r.status); continue; }
      const total=+r.headers.get("content-length")||0, rd=r.body.getReader(), parts=[]; let got=0;
      for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; if(onPct&&total) onPct(Math.min(99,Math.round(got*100/total))); }
      const out=new Uint8Array(got); let q=0; parts.forEach(x=>{out.set(x,q);q+=x.length;}); return out;
    }catch(e){ last=e; }
  }
  throw last||new Error("download");
}
let jszipP=null;
function loadJSZip(){ return jszipP||(jszipP=new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="jszip.min.js"; s.onload=()=>ok(window.JSZip); s.onerror=no; document.head.appendChild(s); })); }
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); }

/** who a new file is for: me, or (owner) one of the installers */
function fileTarget(sel){
  if(me.role==="installer") return {installerId:me.uid,code:me.code,iName:me.name,iPhone:me.phone,profile:me.defaultProfile||null};
  if(!sel||sel==="owner") return {installerId:"owner",code:"",iName:D.config.ownerName||"מוקד קיידרואיד",iPhone:D.config.ownerPhone||"",profile:D.ownerProfile||null};
  const i=D.installers.find(x=>x._id===sel)||{};
  return {installerId:i._id,code:i.code||"",iName:i.name||"",iPhone:i.phone||"",profile:parse(i.defaultProfile)||null};
}

async function createFile(kind,target,status,keep){
  status("מכין מפתחות לקודי חירום…",0);
  let made=null;
  for(let t=0;t<4&&!made;t++){
    const fid=String(100000+Math.floor(Math.random()*900000)), seeds={};
    // the release chain: made right here by whoever may release (the owner, or an installer allowed to release),
    // otherwise taken from the owner's stock, so an installer without release permission never holds a release seed
    let r, claim;
    if(me.canRelease){
      const rid=newId(), sd=randomSeed();
      r={_id:rid,tip:fmt12(await chainTip(sd,rid,"release"))};
      claim=[{set:"releaseTips/"+rid,create:true,data:{tip:r.tip,fid,installerId:target.installerId,createdAt:Date.now()}},
             {set:"releaseSeeds/"+rid,create:true,data:{seed:fmt12(sd)}}];
    } else {
      const free=await query("releaseTips","fid","");
      if(!free.length) throw new Error("nopool");
      r=free[Math.floor(Math.random()*free.length)];
      claim=[{set:"releaseTips/"+r._id,data:{fid,installerId:target.installerId},mask:["fid","installerId"]}];
    }
    const tips={release:r.tip};
    for(const a of ROUTE_ACTS){ const sd=randomSeed(); seeds[a]=fmt12(sd); tips[a]=fmt12(await chainTip(sd,fid,a)); }
    try{
      await commit([...claim,
        {set:"installFiles/"+fid,create:true,data:{installerId:target.installerId,kind,createdAt:Date.now(),by:me.uid,seeds:JSON.stringify(seeds),releaseId:r._id}},
        audit("","install_file",(kind==="pc"?"קובץ למחשב ":"קובץ לטלפון ")+fid+(me.role==="owner"?" · "+target.iName:""))]);
      made={fid,rid:r._id,tips};
    }catch(e){ console.warn("claim retry",e); }
  }
  if(!made) throw new Error("claim");
  const api=await fetch("../api.json?t="+Date.now()).then(r=>r.json()).catch(()=>fetch(RAW+"api.json?t="+Date.now()).then(r=>r.json())).catch(()=>({}));
  const payload=JSON.stringify({v:1,kind,fid:made.fid,rid:made.rid,installerId:target.installerId,code:target.code,
    iName:target.iName,iPhone:target.iPhone,profile:target.profile,n:CH_N,tips:made.tips,keep:!!keep,createdAt:Date.now()});
  status("מוריד את הגרסה העדכנית"+(api.version?" ("+api.version+")":"")+"…",1);
  const apk=injectApk(await fetchFile("kdroid.bin",p=>status(null,p)),payload);
  if(kind==="phone"){ saveBlob(apk,(keep?"kiydroid-installer-":"kiydroid-setup-")+made.fid+".apk"); return made.fid; }
  status("מכין את תוכנת ההתקנה למחשב…",99);
  const base=(keep?"Kiydroid-Installer-Permanent-":"Kiydroid-Setup-")+made.fid;
  saveBlob(await pcSetup(apk,{fid:made.fid,version:api.version||"",installer:target.iName,phone:target.iPhone||"",keep:!!keep,kind:"pc"}),base+".exe");
  return made.fid;
}

/** the PC installer: one portable program (adb inside) with this app and its details appended (pcsetup/payload.go) */
async function pcSetup(apk,info){
  const stub=await fetchFile("installer/base/KiydroidSetup.exe");
  const json=new TextEncoder().encode(JSON.stringify(info));
  const ft=new Uint8Array(32), dv=new DataView(ft.buffer);
  ft.set(new TextEncoder().encode("KIYDPAY1"),0); dv.setBigUint64(8,BigInt(json.length),true); dv.setBigUint64(16,BigInt(apk.size),true);
  ft.set(new TextEncoder().encode("KIYDEND1"),24);
  return new Blob([stub,json,apk,ft],{type:"application/octet-stream"});
}

async function offlineCode(fid,act,k){
  const f=await getDoc("installFiles/"+fid);
  if(!f) throw new Error("nofile");
  let seed,sid;
  if(act==="release"){
    const s=await getDoc("releaseSeeds/"+f.releaseId).catch(()=>null);
    if(!s) throw new Error("noperm");
    seed=s.seed; sid=f.releaseId;
  } else { seed=(parse(f.seeds)||{})[act]; sid=fid; }
  if(!seed) throw new Error("nofile");
  return fmt12(await chainCode(seed,sid,act,k));
}

// ---------------------------------------------------------------- public download stock (owner)
// Every download from the public site takes one unique lock set from this stock, so a code that leaks from one
// download opens nothing else. The owner's panel keeps it full in the background.
const PUBLIC_TARGET = 1000, PUBLIC_LOW = 100;
async function countWhere(col,field,value){
  const j=await req("POST",FS+":runAggregationQuery",{structuredAggregationQuery:{aggregations:[{alias:"n",count:{}}],
    structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:value}}}}}});
  const r=(j[0]&&j[0].result&&j[0].result.aggregateFields&&j[0].result.aggregateFields.n)||{};
  return Number(r.integerValue||0);
}
async function makePublicFile(){
  for(let t=0;t<3;t++){
    const fid=String(100000+Math.floor(Math.random()*900000)), rid=newId(), seeds={}, tips={};
    const rs=randomSeed(); tips.release=fmt12(await chainTip(rs,rid,"release"));
    for(const a of ROUTE_ACTS){ const sd=randomSeed(); seeds[a]=fmt12(sd); tips[a]=fmt12(await chainTip(sd,fid,a)); }
    try{
      await commit([
        {set:"installFiles/"+fid,create:true,data:{installerId:"owner",kind:"public",createdAt:Date.now(),by:me.uid,seeds:JSON.stringify(seeds),releaseId:rid}},
        {set:"releaseTips/"+rid,create:true,data:{tip:tips.release,fid,installerId:"owner",createdAt:Date.now()}},
        {set:"releaseSeeds/"+rid,create:true,data:{seed:fmt12(rs)}},
        {set:"publicFiles/"+fid,create:true,data:{tips:JSON.stringify(tips),rid,state:"free",createdAt:Date.now()}}]);
      return true;
    }catch(e){ console.warn("public file retry",e); }
  }
  return false;
}
let pubBusy=false, pubMade=0;
async function ensurePublicStock(){
  if(me.role!=="owner"||pubBusy) return; pubBusy=true;
  try{
    D.publicFree=await countWhere("publicFiles","state","free");
    let need=PUBLIC_TARGET-D.publicFree;
    const worker=async()=>{ while(need>0&&me&&me.role==="owner"){ need--; if(await makePublicFile()){ D.publicFree++; pubMade++; showStock(); } } };
    if(need>0) await Promise.all([worker(),worker(),worker(),worker()]); // four at a time: the hashing runs off the page thread
  }catch(e){ console.warn("public stock",e); }
  pubBusy=false; showStock();
}
async function loadPublicLog(){

       D.publicEmpty=l.filter(x=>x.type==="empty"&&x.at>since).length; D.publicDownloads=l.filter(x=>x.type==="download"&&x.at>since).length; }catch(e){}
}
/** the stock line in the install tab, refreshed in place while the stock fills */
function showStock(){

  const f=D.publicFree, pct=Math.min(100,Math.round(f*100/PUBLIC_TARGET));

      המלאי מתמלא כשהפאנל פתוח אצלך, בערך 4 קבצים בכמה שניות.</div>`;
}

      <p class="muted" style="margin-top:0">מי שמוריד מדף ההורדה הציבורי מקבל קובץ ייחודי משלו מהמלאי. המכשיר יופיע אצלך כמוקד, וקודי החירום שלו לא יעבדו על אף מכשיר אחר.</p>
      <div id="stockBox" class="note info">בודק את המלאי…</div></div></section>`:""}
    ${filesOff?`<section class="card"><div class="hd">${icon("download")}<h2>קובצי התקנה</h2></div><div class="bd"><div class="note warn">הורדת קבצים כבויה כרגע על ידי מנהל המערכת. אפשר להתקין דרך הקישור האישי.</div></div></section>`:""}
    <section class="card"><div class="hd"><h2>קבצים שהורדו</h2></div><div class="list" id="fileList"><div class="empty">טוען…</div></div></section>
  </div><div class="grid">
    <section class="card"><div class="hd">${icon("key")}<h2>קוד חירום למכשיר שלא התחבר</h2></div><div class="bd">
      <p class="muted" style="margin-top:0">למכשיר שהותקן מקובץ ועוד לא התחבר לאינטרנט. במסך "קוד חירום" שלו מופיעים מספר הקובץ ומספר הקוד. מכשיר שכבר מופיע בפאנל מקבל קוד מהעמוד שלו.</p>
      <div class="field"><label class="f" for="ofFid">מספר הקובץ</label><input id="ofFid" type="text" inputmode="numeric" dir="ltr" class="num" placeholder="6 ספרות"></div>
      <div class="field"><label class="f" for="ofAct">הבקשה</label><select id="ofAct">${EMERG.filter(([k])=>k!=="release"||me.canRelease).map(([k,x])=>`<option value="${k}">${x}</option>`).join("")}</select></div>
      <div class="field"><label class="f" for="ofK">קוד מספר</label><input id="ofK" type="text" inputmode="numeric" dir="ltr" class="num" placeholder="1"></div>
      <button class="btn tonal" id="ofBtn" style="width:100%">צור קוד</button>
      <div id="ofOut" hidden style="margin-top:14px"><div class="muted" style="text-align:center">הקריאו למשתמש:</div><div class="bigcode long num" id="ofCode" dir="ltr"></div></div>
    </div></section>
  </div></div>`;
  if($("ftWho")){ $("ftWho").value=v.dataset.who||"owner"; $("ftWho").onchange=e=>{ v.dataset.who=e.target.value; vInstall(v); }; }
  const st=$("mkStatus");
  const status=(msg,pct)=>{ st.hidden=false; if(msg!=null) status.m=msg; st.textContent=status.m+(pct?" "+pct+"%":""); };
  v.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{ mkType=b.dataset.type; vInstall(v); });
  v.querySelectorAll("[data-keep2]").forEach(b=>b.onclick=()=>{ mkKeep=b.dataset.keep2==="1"; vInstall(v); });
  if($("mkBtn")) $("mkBtn").onclick=async()=>{ const b=$("mkBtn");
    b.disabled=true; typing=true;
    try{ const keep=mkKeep, fid=await createFile(mkType,fileTarget(who),status,keep);
         st.className="note ok"; st.textContent="הקובץ מוכן ("+fid+(keep?", קבוע":", נמחק בסוף ההתקנה")+") ונשמר בהורדות."; myFiles=null; listFiles(); }
    catch(e){ st.className="note err"; st.hidden=false;
      st.textContent=e.message==="nopool"?"אין כרגע מפתחות שחרור פנויים. בקשו ממנהל המערכת להיכנס לפאנל, והם ייווצרו מעצמם."
        :"יצירת הקובץ נכשלה. בדקו את החיבור ונסו שוב."; console.error(e); }
    b.disabled=false; typing=false;
  };
  $("ofBtn").onclick=async()=>{
    const fid=$("ofFid").value.replace(/\D/g,""), k=parseInt($("ofK").value.replace(/\D/g,"")||"1",10), act=$("ofAct").value;
    if(fid.length!==6){ toast("מספר הקובץ צריך להיות 6 ספרות"); return; }
    if(!(k>=1&&k<=CH_N)){ toast("מספר הקוד צריך להיות בין 1 ל-"+CH_N); return; }
    const b=$("ofBtn"); b.disabled=true; b.textContent="מחשב…";
    try{ const c=await offlineCode(fid,act,k); $("ofCode").textContent=group12(c); $("ofOut").hidden=false;
         commit([audit("","offline_code",EMERG.find(x=>x[0]===act)[1]+" · קובץ "+fid+" · קוד "+k)]).catch(()=>{}); }
    catch(e){ toast(e.message==="noperm"?"אין לך הרשאה לשחרר מכשירים":e.message==="nofile"?"לא נמצא קובץ עם המספר הזה אצלך":"יצירת הקוד נכשלה"); }
    b.disabled=false; b.textContent="צור קוד";
  };
  listFiles(); showStock();
}
async function listFiles(){
  const el=$("fileList"); if(!el) return;
  try{
    if(!myFiles) myFiles=(me.role==="owner"?await listAll("installFiles"):await query("installFiles","installerId",me.uid)).filter(f=>f.kind!=="public").sort((a,b)=>b.createdAt-a.createdAt);
    el.innerHTML=myFiles.slice(0,40).map(f=>`<div class="item"><div class="main"><div class="t">${f.kind==="pc"?"קובץ למחשב":"קובץ לטלפון"} · <span class="num">${esc(f._id)}</span></div>
      <div class="muted">${when(f.createdAt)}${me.role==="owner"?" · "+esc(installerLabel(f.installerId)):""}</div></div></div>`).join("")||'<div class="empty">עוד לא הורדו קבצים</div>';
  }catch(e){ el.innerHTML='<div class="empty">לא הצלחתי לטעון</div>'; }
}

// ---------------------------------------------------------------- settings
// what the owner can switch off. Every switch is on unless turned off; the security rules check them too.
const FEATURES=[
  ["אתר ההורדה הציבורי",[
    ["site","האתר כולו","כשכבוי, אי אפשר להוריד או להתקין מהאתר בכלל"],
    ["siteWeb","התקנה מהדפדפן","חיבור הטלפון בכבל למחשב והתקנה ישירות מהדף"],
    ["sitePhone","הורדה לטלפון","קובץ להתקנה בטלפון או במסך מולטימדיה"],
    ["sitePc","תוכנה למחשב","תוכנת התקנה ל-Windows דרך כבל"]]],
  ["מתקינים",[
    ["links","קישורים אישיים","התקנה דרך הקישור של מתקין מחברת את המכשיר אליו"],
    ["installerFiles","הורדת קבצים בפאנל","מתקינים יכולים להוריד קובצי התקנה בלשונית 'התקנה'"]]],
  ["משתמשים",[
    ["messages","פניות למערכת","משתמשים יכולים לשלוח לך הודעות מהאפליקציה"]]]];
let setTab="profile";
function vSettings(v){
  const own=me.role==="owner", p=defaultProfile();
  const tabs=[["profile","ברירת מחדל"]].concat(own?[["centre","פרטי המוקד"],["switches","מתגים"]]:[["me","הפרטים שלי"]]).concat([["account","חשבון"]]);
  if(!tabs.some(t=>t[0]===setTab)) setTab="profile";
  const f=D.config.features||{}, isOn=k=>k==="messages"?D.config.messagesOff!==true:f[k]!==false;
  const body={
    profile:`<section class="card"><div class="hd"><h2>פרופיל ברירת מחדל</h2></div><div class="bd">
      <p class="muted" style="margin-top:0">זו ברירת המחדל שמוצעת בהתקנה של כל מכשיר ${own?"שנרשם בלי קוד מתקין":"עם הקוד שלך"}. במכשיר אפשר לבחור בה, או להגדיר אחרת לפני הנעילה.</p>
      ${MODES.map(m=>`<label class="opt ${p.filter_mode===m.v?"on":""}"><input type="radio" name="dmode" value="${m.v}" ${p.filter_mode===m.v?"checked":""}><span><b>${m.t}</b><span class="muted">${esc(m.d)}</span></span></label>`).join("")}
      ${SETTINGS.map(([k,t])=>`<div class="sw"><span>${t}</span><label class="toggle"><input type="checkbox" data-dk="${k}" ${p.settings[k]?"checked":""} aria-label="${t}"><i></i></label></div>`).join("")}
      <button class="btn fill" id="saveProf" style="margin-top:16px">שמור פרופיל</button></div></section>`,
    centre:`<section class="card"><div class="hd"><h2>פרטי המוקד</h2></div><form class="bd" id="pubForm">
      <p class="muted" style="margin-top:0">מוצגים במכשירים שנרשמו בלי קוד מתקין, ובאתר ההורדה.</p>
      <div class="field"><label class="f" for="oName">שם</label><input id="oName" type="text" value="${esc(D.config.ownerName||"מוקד קיידרואיד")}"></div>
      <div class="field"><label class="f" for="oPhone">טלפון</label><input id="oPhone" type="tel" dir="ltr" value="${esc(D.config.ownerPhone||"")}"></div>
      <button class="btn tonal" type="submit">שמור</button></form></section>`,
    switches:`<div class="grid">${FEATURES.map(([g,items])=>`<section class="card"><div class="hd"><h2>${g}</h2></div><div class="bd" style="padding-top:4px">
      ${items.map(([k,t,d])=>`<div class="sw sw2"><span><b>${t}</b><span class="muted">${d}</span></span>
        <label class="toggle"><input type="checkbox" data-feat="${k}" ${isOn(k)?"checked":""} aria-label="${t}"><i></i></label></div>`).join("")}</div></section>`).join("")}
      <div class="note info">כשמתג כבוי, האפשרות נעלמת מהאתר או מהפאנל, וגם השרת עצמו חוסם אותה, כך שאי אפשר לעקוף אותה.</div></div>`,
    me:`<section class="card"><div class="hd"><h2>הפרטים שלי</h2></div><div class="bd"><dl class="kv"><dt>שם</dt><dd>${esc(me.name)}</dd><dt>טלפון</dt><dd dir="ltr" style="text-align:right">${esc(me.phone)}</dd><dt>קוד מתקין</dt><dd><b class="num" style="letter-spacing:2px">${esc(me.code)}</b></dd>
      <dt>שחרור מכשירים</dt><dd>${me.canRelease?"מותר":"רק דרך מנהל המערכת"}</dd><dt>מחיקת מכשירים</dt><dd>${me.canDelete?"מותר":"רק דרך מנהל המערכת"}</dd></dl></div></section>`,
    account:`<section class="card"><div class="hd"><h2>החלפת סיסמה</h2></div><form class="bd" id="pwForm">
      <div class="field"><label class="f" for="np">סיסמה חדשה</label><input id="np" type="password" dir="ltr" minlength="8" autocomplete="new-password" required></div>
      <button class="btn tonal" type="submit">החלף סיסמה</button><p class="err" id="pwErr"></p></form></section>`};
  v.innerHTML=`<div class="subtabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" class="${k===setTab?"on":""}" aria-selected="${k===setTab}" data-st="${k}">${t}</button>`).join("")}</div>
    <div style="max-width:760px">${body[setTab]}</div>`;
  v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ setTab=b.dataset.st; vSettings(v); });
  if($("saveProf")) $("saveProf").onclick=async()=>{
    const fm=(v.querySelector('input[name=dmode]:checked')||{}).value||"NavigationMode", st={};
    v.querySelectorAll("[data-dk]").forEach(c=>st[c.dataset.dk]=c.checked);
    const json=JSON.stringify({filter_mode:fm,settings:st});
    try{ if(own){ await commit([{set:"config/ownerProfile",data:{json}}]); D.ownerProfile=parse(json); }
         else{ await commit([{set:"installers/"+me.uid,data:{defaultProfile:json},mask:["defaultProfile"]},
                             {set:"installerCodes/"+me.code,data:{profile:json},mask:["profile"],exists:true}]); me.defaultProfile=parse(json); }
         toast("הפרופיל נשמר"); }catch(e){ toast("השמירה נכשלה"); }
  };
  v.querySelectorAll('input[name=dmode]').forEach(r=>r.onchange=()=>v.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.contains(v.querySelector('input[name=dmode]:checked')))));
  if($("pubForm")) $("pubForm").onsubmit=async e=>{ e.preventDefault();
    try{ await commit([{set:"config/public",data:{ownerName:$("oName").value.trim(),ownerPhone:$("oPhone").value.trim()},mask:["ownerName","ownerPhone"]}]); toast("נשמר"); load(); }catch(err){ toast("השמירה נכשלה"); } };
  v.querySelectorAll("[data-feat]").forEach(c=>c.onchange=async()=>{
    const k=c.dataset.feat, onNow=c.checked;
    try{
      if(k==="messages"){ await commit([{set:"config/public",data:{messagesOff:!onNow},mask:["messagesOff"]}]); D.config.messagesOff=!onNow; }
      else { const nf=Object.assign({},D.config.features||{},{[k]:onNow}); await commit([{set:"config/public",data:{features:nf},mask:["features"]}]); D.config.features=nf; }
      toast(onNow?"הופעל":"כובה");
    }catch(e){ c.checked=!onNow; toast("השינוי נכשל"); }
  });
  if($("pwForm")) $("pwForm").onsubmit=async e=>{ e.preventDefault(); $("pwErr").textContent="";
    try{ await auth.currentUser.updatePassword($("np").value); toast("הסיסמה הוחלפה"); e.target.reset(); }
    catch(err){ $("pwErr").textContent=err.code==="auth/requires-recent-login"?"מטעמי אבטחה, צאו והיכנסו שוב ואז נסו שוב.":"ההחלפה נכשלה."; } };
}

// ---------------------------------------------------------------- dialog
function confirmDlg(title,body,okLabel,fn,typeToConfirm){
  const dlg=$("dlg");
  $("dlgIn").innerHTML=`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p>
    ${typeToConfirm?`<div class="field"><label class="f" for="dlgType">לאישור, הקלידו את השם: <b>${esc(typeToConfirm)}</b></label><input id="dlgType" type="text"></div>`:""}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn text" id="dlgNo">ביטול</button><button class="btn danger fill" id="dlgOk" ${typeToConfirm?"disabled":""}>${esc(okLabel)}</button></div>`;
  if(typeToConfirm) $("dlgType").oninput=e=>{$("dlgOk").disabled=e.target.value.trim()!==String(typeToConfirm).trim();};
  $("dlgNo").onclick=()=>dlg.close();
  $("dlgOk").onclick=async()=>{ $("dlgOk").disabled=true; try{ await fn(); dlg.close(); }catch(e){ toast("הפעולה נכשלה"); $("dlgOk").disabled=false; } };
  dlg.showModal();
}
</script>
</body>
</html>
