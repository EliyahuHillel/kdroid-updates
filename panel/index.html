<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מרכז שליטה קידרואיד</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eef1f5; --line:#d9dee6;
    --fg:#1a2230; --muted:#64708a; --accent:#1f7a5a; --accent-fg:#ffffff;
    --good:#1f7a5a; --warn:#b4701a; --danger:#b4342f; --chip:#e4ebe8;
    --shadow:0 1px 3px rgba(20,30,48,.08),0 6px 18px rgba(20,30,48,.06);
    --font:system-ui,'Segoe UI',Arial,sans-serif;
    --mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#10151d; --panel:#192330; --panel-2:#141c27; --line:#2a3645;
    --fg:#e7edf5; --muted:#92a0b6; --accent:#35c08a; --accent-fg:#06110c;
    --good:#35c08a; --warn:#e0a94a; --danger:#f0756e; --chip:#213041;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;
  }}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;line-height:1.5;font-size:15px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2{margin:0;text-wrap:balance}
  .wrap{max-width:1040px;margin:0 auto;padding-block:18px 40px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:18px}
  header.top h1{font-size:19px;font-weight:800}
  .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card .hd{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card .hd h2{font-size:14px;font-weight:700}
  .card .bd{padding:14px 15px}
  .addrow{display:flex;gap:8px;margin-bottom:12px}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
  textarea{resize:vertical;min-height:62px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
  .btn:disabled{opacity:.55;cursor:default}
  ul.devs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:480px;overflow:auto}
  ul.devs li{padding:10px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel-2)}
  ul.devs li:hover{border-color:var(--accent)}
  ul.devs li.sel{border-color:var(--accent);background:var(--chip)}
  ul.devs .nm{font-weight:700;font-size:14px}
  ul.devs .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 8px}
  .field{margin-bottom:15px}
  .field>label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin-bottom:6px}
  .apps{display:flex;flex-direction:column;gap:7px}
  .app{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
  .app .m{flex:1;min-width:0}
  .app .t{font-weight:600;font-size:14px}
  .app .p{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
  .app .del{color:var(--muted);background:transparent;border:none;cursor:pointer;font-size:16px;padding:4px}
  .app .del:hover{color:var(--danger)}
  .sw{position:relative;width:42px;height:24px;flex:none}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
  .sw span::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.15s}
  .sw input:checked+span{background:var(--accent)}
  .sw input:checked+span::before{transform:translateX(-18px)}
  .tl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .tl:last-child{border-bottom:none}
  .tl .tt{flex:1}.tl .tt b{font-weight:600;font-size:14px;display:block}.tl .tt small{color:var(--muted);font-size:12px}
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pick button{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--fg);cursor:pointer}
  .pick button:hover{border-color:var(--accent);border-style:solid}
  .info{font-size:12.5px;color:var(--muted)}
  .err{color:var(--danger);font-size:13px;margin-top:8px}
  .login{max-width:380px;margin:60px auto}
  .login .bd{display:flex;flex-direction:column;gap:10px}
  .namebox{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
  .badge.new{background:var(--warn);color:#fff}
  .badge.ok{background:var(--chip);color:var(--good)}
  .badge.wait{background:var(--chip);color:var(--warn)}
  .applist{display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel-2);margin-top:8px}
  .applist label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .applist label:hover{background:var(--chip)}
  .applist input{width:auto}
  .applist .p{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
  .warnbox{font-size:12.5px;color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:8px 10px;margin-top:8px}
  .statusline{font-size:12.5px;color:var(--muted);margin-bottom:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">ק</div>
    <div><h1>מרכז שליטה קידרואיד</h1><div class="sub">ניהול מכשירים מרחוק</div></div>
    <div class="spacer"></div>
    <span class="info" id="who"></span>
    <button class="btn" id="logoutBtn" hidden>יציאה</button>
  </header>

  <!-- כניסה -->
  <section class="card login" id="loginCard" hidden>
    <div class="hd"><h2>כניסת מנהל</h2></div>
    <form class="bd" id="loginForm">
      <input id="email" type="email" placeholder="מייל" autocomplete="username" required>
      <input id="pass" type="password" placeholder="סיסמה" autocomplete="current-password" required>
      <button class="btn primary" type="submit">כניסה</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>


  <!-- אפליקציה -->
  <div class="grid" id="appArea" hidden>
    <section class="card">
      <div class="hd"><h2>מכשירים</h2><span class="spacer"></span><span class="sub" id="devCount">0</span></div>
      <div class="bd">
        <div class="info" style="margin-bottom:10px">מכשיר שהוקלד בו שם יופיע כאן לבד תוך כמה דקות. אפשר גם להוסיף שם ידנית:</div>
        <div class="addrow">
          <input id="newName" placeholder="שם המכשיר, כמו שהוקלד בו" aria-label="שם מכשיר">
          <button class="btn primary" id="addBtn">הוסף</button>
        </div>
        <ul class="devs" id="devList"></ul>
        <div class="empty" id="devEmpty">אין עדיין מכשירים.</div>
        <div class="err" id="listErr"></div>
        <div class="info" id="diag" style="margin-top:8px"></div>
      </div>
    </section>
    <section class="card">
      <div class="hd"><h2 id="edTitle">בחר מכשיר</h2><span class="spacer"></span><button class="btn danger" id="delBtn" hidden>מחק</button></div>
      <div class="bd" id="editor"><div class="empty">בחר מכשיר מהרשימה.</div></div>
    </section>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBmdgQkWz5wl7eL23Mgwc5m0X856L1t2NI",
  authDomain: "kiydroid.firebaseapp.com",
  projectId: "kiydroid",
  storageBucket: "kiydroid.firebasestorage.app",
  messagingSenderId: "303401885325",
  appId: "1:303401885325:web:5be1b385c598384d5a4cc4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const fs = firebase.firestore();
try { fs.settings({experimentalForceLongPolling:true, merge:true}); } catch(e) { console.warn(e); }

// המסלולים וההגדרות כפי שהם קיימים באפליקציה
const NAV_APPS = ["וויז","פנגו","מוביט","רכבת ישראל","Gett","מוזיקה יהודית","הקראת טקסט של Google"];
const MODES = [
  {v:"KosherMode",         t:"מסלול כשר",         d:"אין חיבור לאינטרנט בכלל."},
  {v:"NavigationMode",     t:"מסלול ניווט",       d:"אינטרנט רק ל: "+NAV_APPS.join(", ")+"."},
  {v:"NavigationMailMode", t:"מסלול ניווט ומייל", d:"אינטרנט רק ל: "+NAV_APPS.join(", ")+", וג'ימייל."}
];
const SETTINGS = [
  {k:"app_installation_block",  b:"חסום התקנת אפליקציות"},
  {k:"app_uninstall_block",     b:"מניעת הסרת אפליקציות"},
  {k:"hide_store_icon",         b:"הסתר את חנות האפליקציות"},
  {k:"disable_sensible_apps",   b:"השבת אפליקציות רגישות"},
  {k:"call_block",              b:"חסום שיחות יוצאות"},
  {k:"message_block",           b:"חסום הודעות"},
  {k:"wifi_block",              b:"חסום וויפי לחלוטין"},
  {k:"bluetooth_sharing_block", b:"חסום העברת קבצים דרך בלוטות"},
  {k:"usb_sharing_block",       b:"חסום העברת קבצים דרך USB"},
  {k:"external_storage_block",  b:"חסום גישה לאחסון חיצוני"}
];
const MODE_KEYS = MODES.map(m=>m.v);
const SENS_WARN = "אפשרות זו מסתירה ומשביתה אפליקציות שנראות לא כשרות. היזהר: השבתת אפליקציות מערכת עשויה לגרום לתקלות במכשיר. לא מומלץ להוסיף אפליקציות מעבר לרשימה שנבחרה מראש.";

let configs = {};   // devices/{name}: מה שאתה הגדרת
let reports = {};   // deviceApps/{name}: מה שהמכשיר דיווח
let drafts = {};    // עריכה שלא נשמרה
let sel = null, unsubs = [];
const $ = id => document.getElementById(id);
const norm = s => (s||"").replace(/\s+/g," ").trim();
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ms => ms ? new Date(Number(ms)).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"}) : "";
const parse = s => { try { return JSON.parse(s||"null"); } catch(e){ return null; } };

function blank(){ const s={}; SETTINGS.forEach(d=>s[d.k]=false); return {filter_mode:"NavigationMode", settings:s, hiddenApps:null, rev:0, updatedAt:0}; }
function fromState(st){ // מתחילים ממה שבאמת יש במכשיר, כדי לא לשנות בטעות
  const c=blank(); if(!st) return c;
  if(MODE_KEYS.includes(st.filter_mode)) c.filter_mode=st.filter_mode;
  if(st.settings) SETTINGS.forEach(d=>{ if(typeof st.settings[d.k]==="boolean") c.settings[d.k]=st.settings[d.k]; });
  if(Array.isArray(st.hiddenApps)) c.hiddenApps=st.hiddenApps.slice();
  return c;
}
function fromConfig(v){
  const c=blank(); const j=parse(v.json)||{};
  if(MODE_KEYS.includes(j.filter_mode)) c.filter_mode=j.filter_mode;
  if(j.settings) SETTINGS.forEach(d=>{ if(typeof j.settings[d.k]==="boolean") c.settings[d.k]=j.settings[d.k]; });
  if(Array.isArray(j.hiddenApps)) c.hiddenApps=j.hiddenApps.slice();
  c.rev=j.rev||0; c.updatedAt=v.updatedAt||0; return c;
}
function stateOf(name){ const r=reports[name]; return r ? parse(r.state) : null; }
function appsOf(name){ const r=reports[name]; return r ? (parse(r.apps)||[]) : null; }
function working(name){ // מה שמוצג בעורך
  if(drafts[name]) return drafts[name];
  if(configs[name]){ const c=configs[name], st=stateOf(name);
    if(c.hiddenApps==null && st && Array.isArray(st.hiddenApps)) return Object.assign({},c,{hiddenApps:st.hiddenApps.slice()});
    return c; }
  return fromState(stateOf(name));
}

// ---------- auth ----------
auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f()); unsubs=[];
  if(!u){ $("loginCard").hidden=false; $("appArea").hidden=true; $("logoutBtn").hidden=true; $("who").textContent=""; return; }
  $("loginCard").hidden=true; $("appArea").hidden=false; $("logoutBtn").hidden=false; $("who").textContent=u.email;
  const diag={devices:"טוען…", deviceApps:"טוען…"};
  const showDiag=()=>{ $("listErr").textContent = (diag.devices.startsWith("שגיאה")||diag.deviceApps.startsWith("שגיאה"))
      ? "הגדרות: "+diag.devices+" · דיווחי מכשירים: "+diag.deviceApps : "";
    $("diag").textContent="אבחון: הגדרות "+diag.devices+" · דיווחים "+diag.deviceApps; };
  const onErr = col => e => { console.error(col, e); diag[col]="שגיאה ("+(e&&e.code||"?")+")"; showDiag(); };
  unsubs.push(fs.collection("devices").onSnapshot({includeMetadataChanges:true}, s=>{ configs={}; s.forEach(d=>configs[d.id]=fromConfig(d.data())); diag.devices=s.size+" רשומות"+(s.metadata&&s.metadata.fromCache?" (מהזיכרון, אין חיבור לשרת)":""); showDiag(); refresh(); }, onErr("devices")));
  unsubs.push(fs.collection("deviceApps").onSnapshot({includeMetadataChanges:true}, s=>{ reports={}; s.forEach(d=>reports[d.id]=d.data()); diag.deviceApps=s.size+" רשומות"+(s.metadata&&s.metadata.fromCache?" (מהזיכרון, אין חיבור לשרת)":""); showDiag(); refresh(); }, onErr("deviceApps")));
});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginErr").textContent="";
  try{ await auth.signInWithEmailAndPassword($("email").value.trim(), $("pass").value); }
  catch(err){ $("loginErr").textContent="הכניסה נכשלה. בדוק מייל וסיסמה."; }
});
$("logoutBtn").onclick=()=>auth.signOut();

function refresh(){ renderList(); if(!(sel && drafts[sel])) renderEditor(); }

// ---------- save ----------
async function save(){
  const c=working(sel); if(!c) return;
  const btn=$("saveBtn"); btn.disabled=true; $("saveMsg").textContent="שומר…";
  const st=stateOf(sel)||{};
  const rev=Math.max(Date.now(), (c.rev||0)+1, (st.appliedRev||0)+1);
  const payload={deviceName:sel, rev, filter_mode:c.filter_mode, settings:c.settings};
  if(Array.isArray(c.hiddenApps)) payload.hiddenApps=c.hiddenApps;
  try{
    await fs.collection("devices").doc(sel).set({json:JSON.stringify(payload), updatedAt:Date.now()});
    delete drafts[sel];
    $("saveMsg").textContent="נשמר ✓ המכשיר יקבל את זה תוך עד 15 דקות.";
  }catch(e){ $("saveMsg").textContent="השמירה נכשלה: אין הרשאת כתיבה."; }
  btn.disabled=false;
}

// ---------- render ----------
function badge(name){
  const cfg=configs[name], st=stateOf(name);
  if(!cfg) return '<span class="badge new">חדש · ממתין להגדרה</span>';
  if(st && (st.appliedRev||0) >= (cfg.rev||0)) return '<span class="badge ok">הוחל במכשיר ✓</span>';
  return '<span class="badge wait">ממתין למכשיר</span>';
}
function renderList(){
  const ids=[...new Set([...Object.keys(configs),...Object.keys(reports),...Object.keys(drafts)])].sort((a,b)=>a.localeCompare(b,"he"));
  $("devCount").textContent=ids.length; $("devEmpty").hidden=ids.length>0;
  const ul=$("devList"); ul.innerHTML="";
  ids.forEach(id=>{
    const li=document.createElement("li"); li.className=id===sel?"sel":"";
    const r=reports[id];
    li.innerHTML='<div class="nm"></div><div class="meta"></div>';
    li.querySelector(".nm").innerHTML=esc(id)+badge(id);
    li.querySelector(".meta").textContent = r ? ("נראה לאחרונה: "+fmt(r.updatedAt)) : "המכשיר עוד לא התחבר";
    li.onclick=()=>{ if(sel && drafts[sel] && sel!==id && !confirm("יש שינויים שלא נשמרו. לעבור בכל זאת?")) return;
      if(sel!==id && sel) delete drafts[sel]; sel=id; renderList(); renderEditor(); };
    ul.appendChild(li);
  });
}
function draft(){ if(!drafts[sel]) drafts[sel]=JSON.parse(JSON.stringify(working(sel))); const m=$("saveMsg"); if(m) m.textContent="יש שינויים שלא נשמרו"; return drafts[sel]; }

function renderEditor(){
  const box=$("editor");
  if(!sel){ box.innerHTML='<div class="empty">בחר מכשיר מהרשימה.</div>'; $("edTitle").textContent="בחר מכשיר"; $("delBtn").hidden=true; return; }
  const c=working(sel), st=stateOf(sel), apps=appsOf(sel), r=reports[sel];
  $("edTitle").innerHTML=esc(sel)+badge(sel); $("delBtn").hidden=false;

  let status = r ? ("נראה לאחרונה: "+fmt(r.updatedAt)+(st&&st.appVersion?" · גרסה "+esc(st.appVersion):"")) : "המכשיר עוד לא התחבר. ודא שהשם הוקלד במכשיר בדיוק כך.";
  if(st && st.owner===false) status+=" · ⚠ האפליקציה אינה מנהלת המכשיר, שינויים לא יוחלו";
  if(st && st.protected===false) status+=" · ⚠ ההגנה עוד לא הופעלה במכשיר, שינויים לא יוחלו";

  const modes=MODES.map(m=>`<label class="tl" style="cursor:pointer"><input type="radio" name="fMode" value="${m.v}" ${c.filter_mode===m.v?"checked":""} style="width:auto">
      <div class="tt"><b>${m.t}</b><small>${esc(m.d)}</small></div></label>`).join("");
  const sets=SETTINGS.map(d=>{
    let row=`<div class="tl"><div class="tt"><b>${d.b}</b></div>
      <label class="sw"><input type="checkbox" data-set="${d.k}" ${c.settings[d.k]?"checked":""} aria-label="${d.b}"><span></span></label></div>`;
    if(d.k==="disable_sensible_apps" && c.settings[d.k]) row+=sensBlock(c,apps);
    return row; }).join("");

  box.innerHTML=`
    <div class="statusline">${status}</div>
    <div class="field"><label>מסלול</label>${modes}</div>
    <div class="field"><label>הגדרות</label>${sets}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" id="saveBtn">שמור ושלח למכשיר</button>
      <span class="info" id="saveMsg">${drafts[sel]?"יש שינויים שלא נשמרו":(configs[sel]?("נשמר "+fmt(configs[sel].updatedAt)):"עדיין לא נשמר. מוצג המצב הנוכחי במכשיר.")}</span></div>`;

  box.querySelectorAll('input[name="fMode"]').forEach(el=>el.onchange=e=>{draft().filter_mode=e.target.value;});
  box.querySelectorAll("[data-set]").forEach(el=>el.onchange=e=>{draft().settings[e.target.dataset.set]=e.target.checked; if(e.target.dataset.set==="disable_sensible_apps") renderEditor();});
  box.querySelectorAll("[data-hid]").forEach(el=>el.onchange=e=>{
    const d=draft(); const set=new Set(d.hiddenApps||[]);
    e.target.checked ? set.add(e.target.dataset.hid) : set.delete(e.target.dataset.hid);
    d.hiddenApps=[...set]; });
  $("saveBtn").onclick=save;
}
function sensBlock(c,apps){
  if(!apps) return '<div class="warnbox">המכשיר עוד לא שלח את רשימת האפליקציות שלו.</div>';
  const chosen=new Set(c.hiddenApps||[]);
  const rows=apps.map(a=>`<label><input type="checkbox" data-hid="${esc(a.p)}" ${chosen.has(a.p)?"checked":""}>
      <div><div>${esc(a.l)}</div><div class="p">${esc(a.p)}</div></div></label>`).join("");
  return `<div class="warnbox">${SENS_WARN}</div><div class="applist">${rows||'<div class="info">אין אפליקציות</div>'}</div>`;
}

$("addBtn").onclick=()=>{
  const name=norm($("newName").value); if(!name) return;
  if(name.includes("/")){ alert("השם לא יכול להכיל את התו /"); return; }
  $("newName").value=""; if(sel && sel!==name) delete drafts[sel];
  sel=name; if(!configs[name]) drafts[name]=JSON.parse(JSON.stringify(working(name)));
  renderList(); renderEditor();
};
$("newName").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click();});
$("delBtn").onclick=async()=>{
  if(!sel||!confirm("למחוק את \""+sel+"\" מהפאנל? ההגדרות שכבר הוחלו במכשיר נשארות, אבל הוא יפסיק לקבל שינויים מרחוק.")) return;
  try{ await fs.collection("devices").doc(sel).delete(); }catch(e){}
  try{ await fs.collection("deviceApps").doc(sel).delete(); }catch(e){}
  delete drafts[sel]; sel=null; renderList(); renderEditor();
};
window.addEventListener("beforeunload",e=>{ if(Object.keys(drafts).length){ e.preventDefault(); e.returnValue=""; }});
</script>
</body>
