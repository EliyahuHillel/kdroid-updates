name: Mirror store apps
# Keeps a verified, complete copy of Pango for Kiydroid's store (tools/mirror.py).
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/mirror.py", ".github/workflows/mirror-apps.yml"]
permissions:
  contents: write
concurrency: mirror-apps
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/mirror.py
      - name: Save the app list
        run: |
          git config user.name "kiydroid-bot"
          git config user.email "kiydroid-bot@users.noreply.github.com"
          git add apps
          git diff --cached --quiet || (git commit -m "Store apps: verified update" && git push)
