<style>
/* App palette: Material 3 scheme from seed #006C51 (same as the Android app) */
:root{
  --primary:#006C51; --on-primary:#fff; --primary-c:#83F8CD; --on-primary-c:#002116; --primary-d:#00513C;
  --secondary:#4C6359; --secondary-c:#CEE9DB; --on-secondary-c:#082017;
  --tertiary:#3F6375; --tertiary-c:#C2E8FD; --on-tertiary-c:#001F2B;
  --error:#BA1A1A; --error-c:#FFDAD6; --on-error-c:#410002;
  --bg:#F4F6F2; --surface:#FBFDF9; --surface-hi:#EFF1EE; --on:#191C1A; --variant:#DBE5DE; --on-variant:#404944;
  --outline:#707974; --outline-v:#BFC9C2; --warn:#8A5100; --warn-c:#FFDDB8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{

  --secondary:#B3CCBF; --secondary-c:#354C42; --on-secondary-c:#CEE9DB;
  --tertiary:#A7CCE0; --tertiary-c:#264B5C; --on-tertiary-c:#C2E8FD;
  --error:#FFB4AB; --error-c:#93000A; --on-error-c:#FFDAD6;

}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--on);font-family:var(--font);font-size:15px;line-height:1.5}

nav.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));scrollbar-width:none}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:10px 14px 12px;color:var(--on-variant);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}

.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--error);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
@media (prefers-color-scheme:dark){.count{color:#690005}}
main{max-width:1200px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}

input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],select,textarea{
  width:100%;min-width:0;background:transparent;border:1px solid var(--outline);border-radius:6px;padding:10px 12px;font-size:15px}

input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:1px solid var(--primary)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--on-variant);margin-bottom:5px}

.pill.active{background:var(--primary-c);color:var(--on-primary-c)}
.pill.pending{background:var(--warn-c);color:var(--warn)}
.pill.released{background:var(--variant);color:var(--on-variant)}
.pill.wait{background:var(--tertiary-c);color:var(--on-tertiary-c)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.empty{text-align:center;color:var(--on-variant);padding:36px 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--outline);background:transparent;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--on-variant)}
.chip.on{background:var(--secondary-c);border-color:transparent;color:var(--on-secondary-c);font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--on-variant);text-align:right;padding:10px 14px;border-bottom:1px solid var(--outline-v);white-space:nowrap}

.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:960px){.split{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--outline-v);border-radius:12px;cursor:pointer;margin-bottom:8px}
.opt.on{border:2px solid var(--primary);background:var(--secondary-c);padding:11px 13px}
.opt input{margin-top:4px;accent-color:var(--primary)}
.opt b{display:block;font-weight:600}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--outline-v)}
.sw span{flex:1}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle i{position:absolute;inset:0;border-radius:14px;background:var(--variant);border:2px solid var(--outline);transition:.15s}
.toggle i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--outline);top:5px;right:5px;transition:.15s}
.toggle input:checked+i{background:var(--primary);border-color:var(--primary)}
.toggle input:checked+i::after{width:20px;height:20px;top:2px;right:20px;background:var(--on-primary)}
.toggle input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.applist{max-height:340px;overflow:auto;border:1px solid var(--outline-v);border-radius:10px;margin:8px 0 10px}
.applist label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--outline-v);cursor:pointer}
.applist label:last-child{border-bottom:none}
.applist input{accent-color:var(--primary)}
.applist small{display:block;color:var(--on-variant);font-size:11.5px;direction:ltr;text-align:right}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--warn-c);color:var(--warn)}
.note.err{background:var(--error-c);color:var(--on-error-c)}
.note.ok{background:var(--primary-c);color:var(--on-primary-c)}
.note.info{background:var(--surface-hi);color:var(--on-variant)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--on-variant)}
.kv dd{margin:0;overflow-wrap:anywhere}
.bigcode{font-size:34px;font-weight:700;letter-spacing:6px;direction:ltr;text-align:center;color:var(--primary)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;margin-bottom:12px}
.login{max-width:400px;margin:8vh auto 0;padding:0 16px}
.login .brandbig{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.login .brandbig img{width:72px;height:72px;border-radius:18px}
.login .brandbig b{font-size:24px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--on);color:var(--surface);padding:12px 18px;border-radius:10px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
dialog{border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--on);max-width:min(480px,calc(100vw - 32px));width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .in{padding:22px}
dialog h3{font-size:19px;margin-bottom:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>

<section id="loginView" class="login" hidden>
  <div class="brandbig"><img src="icon.webp" alt=""><b>קיידרואיד</b><span class="muted">מערכת הניהול למתקינים</span></div>
  <form class="card" id="loginForm"><div class="bd">
    <div class="field"><label class="f" for="lEmail">מייל</label><input id="lEmail" type="email" autocomplete="username" dir="ltr" required></div>
    <div class="field"><label class="f" for="lPass">סיסמה</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></div>

    <p class="err" id="loginErr" style="margin:12px 0 0"></p>
    <p style="margin:10px 0 0;text-align:center"><button class="btn text sm" type="button" id="forgotBtn">שכחתי סיסמה</button></p>
  </div></form>
</section>

<div id="appView" hidden>
  <header class="topbar">
    <div class="in">
      <div class="brand"><img src="icon.webp" alt=""><div><b>קיידרואיד</b><small>מערכת ניהול</small></div></div>
      <div class="spacer"></div>
      <div class="who"><span id="whoName" dir="auto"></span><span class="role" id="whoRole"></span></div>
      <button class="btn text sm" id="logoutBtn">יציאה</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const OWNER_EMAIL = "7152207@gmail.com";
const firebaseConfig = {apiKey:"AIzaSyBmdgQkWz5wl7eL23Mgwc5m0X856L1t2NI",authDomain:"kiydroid.firebaseapp.com",projectId:"kiydroid",
  storageBucket:"kiydroid.firebasestorage.app",messagingSenderId:"303401885325",appId:"1:303401885325:web:5be1b385c598384d5a4cc4"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const KEY = firebaseConfig.apiKey;
const DOCS = "projects/kiydroid/databases/(default)/documents";
const FS = "https://firestore.googleapis.com/v1/" + DOCS;

const NAV_APPS = "וויז, פנגו, מוביט, רכבת ישראל, Gett, מוזיקה יהודית והקראת טקסט";
const MODES = [
  {v:"KosherMode", t:"מסלול כשר", d:"אין חיבור לאינטרנט בכלל."},
  {v:"NavigationMode", t:"מסלול ניווט", d:"אינטרנט רק ל: "+NAV_APPS+"."},
  {v:"NavigationMailMode", t:"מסלול ניווט ומייל", d:"כמו מסלול ניווט, ועוד ג'ימייל."}];
const MODE_NAME = Object.fromEntries(MODES.map(m=>[m.v,m.t]));
const SETTINGS = [
  ["app_installation_block","חסום התקנת אפליקציות"],["app_uninstall_block","מניעת הסרת אפליקציות"],
  ["hide_store_icon","הסתר את חנות האפליקציות"],["disable_sensible_apps","השבת אפליקציות רגישות"],
  ["call_block","חסום שיחות יוצאות"],["message_block","חסום הודעות"],["wifi_block","חסום וויפי לחלוטין"],
  ["bluetooth_sharing_block","חסום העברת קבצים דרך בלוטות"],["usb_sharing_block","חסום העברת קבצים דרך USB"],
  ["external_storage_block","חסום גישה לאחסון חיצוני"]];
const REQ_TYPE = {activate:"בקשת הפעלה", route:"שינוי מסלול", setting:"שינוי הגדרה", remove:"הסרת הסינון"};
const TOPIC = {help:"בקשת עזרה", tech:"תקלה טכנית", question:"שאלה", other:"אחר"};
const EMERG = [["NavigationMode","מעבר למסלול ניווט"],["NavigationMailMode","מעבר למסלול ניווט ומייל"],["KosherMode","מעבר למסלול כשר"],["release","שחרור המכשיר"]];
const STALE_MS = 3*24*3600*1000;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parse = s => { try { return JSON.parse(s||"null"); } catch(e){ return null; } };
const ICON = {
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  chat:'<path d="M4 5h16v11H8l-4 4z"/>', back:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M17 6l3 3M15 8l2 2"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'};
const icon = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';
function ago(ms){
  if(!ms) return "עוד לא התחבר";
  const m=Math.round((Date.now()-ms)/60000);
  if(m<2) return "עכשיו"; if(m<60) return "לפני "+m+" דקות";
  const h=Math.round(m/60); if(h<24) return h===1?"לפני שעה":"לפני "+h+" שעות";
  const d=Math.round(h/24); return d===1?"אתמול":"לפני "+d+" ימים";
}
const when = ms => ms ? new Date(Number(ms)).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
function toast(s){ const t=$("toast"); t.textContent=s; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3500); }

// ---------------------------------------------------------------- firestore REST (plain requests: works behind filtering)
async function tok(){ return auth.currentUser.getIdToken(); }
function val(v){ if(!v) return null; if("stringValue" in v) return v.stringValue; if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return v.doubleValue; if("booleanValue" in v) return v.booleanValue; return null; }
function decode(doc){ const o={_id:decodeURIComponent(doc.name.split("/").pop())}; for(const k in (doc.fields||{})) o[k]=val(doc.fields[k]); return o; }
function encode(o){ const f={}; for(const k in o){ const v=o[k]; if(v===undefined) continue;
  if(typeof v==="boolean") f[k]={booleanValue:v}; else if(typeof v==="number"&&Number.isInteger(v)) f[k]={integerValue:String(v)};
  else if(typeof v==="number") f[k]={doubleValue:v}; else f[k]={stringValue:String(v==null?"":v)}; } return f; }
async function req(method,url,body){
  const r=await fetch(url,{method,headers:{Authorization:"Bearer "+await tok(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error((j.error&&j.error.message)||("http "+r.status)); e.code=r.status; throw e; }
  return j;
}
async function getDoc(path){ try{ return decode(await req("GET",FS+"/"+path.split("/").map(encodeURIComponent).join("/"))); }catch(e){ if(e.code===404) return null; throw e; } }
async function listAll(col){
  const out=[]; let pt="";
  do{ const j=await req("GET",FS+"/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):""));
      (j.documents||[]).forEach(d=>out.push(decode(d))); pt=j.nextPageToken||""; }while(pt);
  return out;
}
async function query(col,field,value){
  const j=await req("POST",FS+":runQuery",{structuredQuery:{from:[{collectionId:col}],
    where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:value}}},limit:500}});
  return j.filter(x=>x.document).map(x=>decode(x.document));
}
async function commit(writes){
  await req("POST",FS+":commit",{writes:writes.map(w=>{
    if(w.del) return {delete:DOCS+"/"+w.del};
    const o={update:{name:DOCS+"/"+w.set,fields:encode(w.data)}};
    if(w.mask) o.updateMask={fieldPaths:w.mask};
    if(w.create) o.currentDocument={exists:false};
    return o; })});
  typing=false; // a saved form is done; let the page refresh again
}
const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[b%62]).join("");
const audit = (deviceId,action,detail) => ({set:"audit/"+newId(),create:true,data:{by:me.uid,byName:me.name,deviceId:deviceId||"",action,detail:detail||"",at:Date.now()}});

// ---------------------------------------------------------------- state
let me=null;
let D={devices:[],reports:{},requests:[],messages:[],installers:[],config:{},ownerProfile:null};
let loaded=false, loading=false, draft=null, pollT=null, typing=false;
// typing in any form on the page pauses the automatic redraw, so nothing typed is lost
document.addEventListener("input",e=>{ if(e.target.closest("#view")) typing=true; });

auth.onAuthStateChanged(async u=>{
  clearInterval(pollT); me=null; loaded=false; draft=null;
  if(!u){ $("loginView").hidden=false; $("appView").hidden=true; return; }
  try{
    if(u.email===OWNER_EMAIL) me={uid:u.uid,email:u.email,role:"owner",name:"מנהל המערכת"};
    else{
      const inst=await getDoc("installers/"+u.uid);
      if(!inst||inst.active!==true){ $("loginErr").textContent="החשבון אינו פעיל. פנו למנהל המערכת."; await auth.signOut(); return; }
      me={uid:u.uid,email:u.email,role:"installer",name:inst.name,phone:inst.phone,code:inst.code,defaultProfile:parse(inst.defaultProfile)};
    }
  }catch(e){ $("loginErr").textContent="לא הצלחתי להתחבר לשרת. נסו שוב."; return; }
  $("loginView").hidden=true; $("appView").hidden=false;
  $("whoName").textContent=me.role==="owner"?u.email:me.name; $("whoRole").textContent=me.role==="owner"?"בעלים":"מתקין";
  if(!location.hash) history.replaceState(null,"","#overview");
  render(); await load(); pollT=setInterval(()=>{ if(!draft) load(); },15000);
});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginErr").textContent="";
  try{ await auth.signInWithEmailAndPassword($("lEmail").value.trim(),$("lPass").value); }
  catch(err){ $("loginErr").textContent="הכניסה נכשלה. בדקו מייל וסיסמה."; }
});
$("forgotBtn").onclick=async()=>{
  const em=$("lEmail").value.trim(); if(!em){ $("loginErr").textContent="הקלידו קודם את המייל."; return; }
  try{ await auth.sendPasswordResetEmail(em); $("loginErr").textContent="נשלח קישור לאיפוס הסיסמה למייל."; }catch(e){ $("loginErr").textContent="לא הצלחתי לשלוח. בדקו את המייל."; }
};
$("logoutBtn").onclick=()=>{ if(draft&&!confirm("יש שינויים שלא נשמרו. לצאת בכל זאת?")) return; draft=null; auth.signOut(); };
let lastHash=location.hash;
window.addEventListener("hashchange",()=>{
  if(draft&&!confirm("יש שינויים שלא נשמרו. לעבור בכל זאת?")){ history.replaceState(null,"",lastHash); return; }
  draft=null; lastHash=location.hash; render();
});
window.addEventListener("beforeunload",e=>{ if(draft){ e.preventDefault(); e.returnValue=""; } });

async function load(){
  if(loading||!me) return; loading=true;
  try{
    const own=me.role==="owner";
    const [devs,reps,reqs]=await Promise.all([
      own?listAll("devices"):query("devices","installerId",me.uid),
      own?listAll("reports"):query("reports","installerId",me.uid),
      own?listAll("requests"):query("requests","installerId",me.uid)]);
    D.devices=devs.filter(d=>d.status); D.reports=Object.fromEntries(reps.map(r=>[r._id,r])); D.requests=reqs.sort((a,b)=>b.createdAt-a.createdAt);
    if(own){
      const [msgs,insts,pub,prof]=await Promise.all([listAll("messages"),listAll("installers"),getDoc("config/public"),getDoc("config/ownerProfile")]);
      D.messages=msgs.sort((a,b)=>b.createdAt-a.createdAt); D.installers=insts; D.config=pub||{}; D.ownerProfile=prof?parse(prof.json):null;
    }
    loaded=true;
  }catch(e){ console.error(e); toast("לא הצלחתי לטעון נתונים מהשרת."); }
  loading=false; if(!draft&&!typing) render(); else renderTabs();
}

// ---------------------------------------------------------------- derived
const devById = id => D.devices.find(d=>d._id===id);
const stateOf = id => { const r=D.reports[id]; return r?parse(r.state)||{}:null; };
const appsOf = id => { const r=D.reports[id]; return r?parse(r.apps)||[]:null; };
const lastSeen = id => { const r=D.reports[id]; return r?r.updatedAt:0; };
function installerLabel(id){
  if(id==="owner") return D.config.ownerName||"מוקד קיידרואיד";
  const i=D.installers.find(x=>x._id===id); return i?i.name:(me.role==="installer"&&id===me.uid?me.name:"—");
}
function statusOf(d){
  if(d.status==="released") return {k:"released",t:"שוחרר"};
  if(d.status==="active"){ const st=stateOf(d._id); if(!st||(st.appliedRev||0)<(d.rev||0)) return {k:"wait",t:"ממתין למכשיר"}; return {k:"active",t:"מוגן"}; }
  return {k:"pending",t:"ממתין להפעלה"};
}
const pill = s => '<span class="pill '+s.k+'"><span class="dot"></span>'+s.t+'</span>';
const openRequests = () => D.requests.filter(r=>r.status==="open");
const openMessages = () => D.messages.filter(m=>m.status==="open");
const isStale = d => d.status==="active" && lastSeen(d._id) && Date.now()-lastSeen(d._id)>STALE_MS;
function defaultProfile(){
  const p = me.role==="owner" ? D.ownerProfile : me.defaultProfile;
  const s={}; SETTINGS.forEach(([k])=>s[k]=true);
  return p ? {filter_mode:p.filter_mode||"NavigationMode", settings:Object.assign(s,p.settings||{}), hiddenApps:null}
           : {filter_mode:"NavigationMode", settings:s, hiddenApps:null};
}
function currentPolicy(d){
  const st=stateOf(d._id);
  const p=parse(d.policy);
  if(p) return {filter_mode:p.filter_mode, settings:Object.assign({},p.settings||{}), hiddenApps:p.hiddenApps||(st&&st.hiddenApps)||null};
  if(st&&st.protected) return {filter_mode:st.filter_mode||"NavigationMode", settings:Object.assign({},st.settings||{}), hiddenApps:st.hiddenApps||null};
  const dp=defaultProfile(); if(st&&Array.isArray(st.hiddenApps)) dp.hiddenApps=st.hiddenApps; return dp;
}

// ---------------------------------------------------------------- router
function render(){
  if(!me) return;
  typing=false;
  const h=(location.hash||"#overview").slice(1), i=h.indexOf("/"), route=i<0?h:h.slice(0,i), arg=i<0?"":decodeURIComponent(h.slice(i+1));
  renderTabs(route);
  const v=$("view");
  if(!loaded){ v.innerHTML='<div class="empty">טוען…</div>'; return; }
  const views={overview:vOverview,devices:vDevices,device:()=>vDevice(arg),requests:vRequests,messages:vMessages,installers:vInstallers,settings:vSettings};
  if((route==="messages"||route==="installers")&&me.role!=="owner") return vOverview(v);
  (views[route]||vOverview)(v);
}
function renderTabs(route){
  if(!me) return;
  if(route===undefined){ const h=(location.hash||"#overview").slice(1), i=h.indexOf("/"); route=i<0?h:h.slice(0,i); }
  const tabs=[["overview","סקירה"],["devices","מכשירים"],["requests","בקשות",openRequests().length]];
  if(me.role==="owner") tabs.push(["messages","פניות",openMessages().length],["installers","מתקינים"]);
  tabs.push(["settings","הגדרות"]);
  const cur = route==="device"?"devices":route;
  $("tabs").innerHTML=tabs.map(([k,t,n])=>'<a href="#'+k+'" class="'+(k===cur?"on":"")+'">'+t+(n?'<span class="count">'+n+'</span>':"")+'</a>').join("");
}

// ---------------------------------------------------------------- overview
function vOverview(v){
  const act=D.devices.filter(d=>d.status==="active").length, pend=D.devices.filter(d=>d.status==="pending").length;
  const stale=D.devices.filter(isStale), reqs=openRequests(), att=attention();
  v.innerHTML=`<div class="grid">
    ${me.role==="installer"?`<div class="note ok">קוד המתקין שלך: <b class="num" style="font-size:18px;letter-spacing:2px">${esc(me.code)}</b> · מסרו אותו למי שמתקין לבד, כדי שהמכשיר יגיע אליכם.</div>`:""}
    <div class="tiles">
      <a class="tile" href="#devices"><div class="v num">${act}</div><div class="l">מכשירים מוגנים</div></a>
      <a class="tile ${pend?"alert":""}" href="#devices"><div class="v num">${pend}</div><div class="l">ממתינים להפעלה</div></a>
      <a class="tile ${reqs.length?"alert":""}" href="#requests"><div class="v num">${reqs.length}</div><div class="l">בקשות פתוחות</div></a>
      <a class="tile ${stale.length?"alert":""}" href="#devices"><div class="v num">${stale.length}</div><div class="l">לא התחברו 3 ימים ומעלה</div></a>
    </div>
    <div class="split">
      <section class="card"><div class="hd"><h2>בקשות פתוחות</h2><span class="spacer"></span><a class="btn text sm" href="#requests">לכל הבקשות</a></div>
        <div class="list">${reqs.slice(0,6).map(reqItem).join("")||'<div class="empty">אין בקשות פתוחות</div>'}</div></section>
      <section class="card"><div class="hd"><h2>דורשים תשומת לב</h2></div>
        <div class="list">${att.map(d=>`<a class="item" style="text-decoration:none;color:inherit" href="#device/${encodeURIComponent(d._id)}">
          <div class="main"><div class="t">${esc(d.name)}</div><div class="muted">${esc(d.why)}</div></div>${pill(statusOf(d))}</a>`).join("")||'<div class="empty">הכל תקין</div>'}</div></section>
    </div></div>`;
}
function attention(){
  const out=[];
  D.devices.forEach(d=>{
    const st=stateOf(d._id), x=w=>out.push(Object.assign({why:w},d));
    if(d.status==="pending") x("נרשם "+ago(d.createdAt)+", ממתין להפעלה");
    else if(d.status==="released") return;
    else if(isStale(d)) x("לא התחבר "+ago(lastSeen(d._id)));
    else if(st&&st.lastErr) x("שגיאה במכשיר: "+st.lastErr);
    else if(st&&st.owner===false) x("האפליקציה אינה מנהלת את המכשיר");
  });
  return out.slice(0,8);
}
function reqItem(r){
  const d=devById(r.deviceId)||{name:"מכשיר לא ידוע"};
  return `<div class="item"><div class="badgeicon" style="background:var(--warn-c);color:var(--warn)">${icon(r.type==="activate"?"shield":"edit")}</div>
    <div class="main"><div class="t">${esc(REQ_TYPE[r.type]||r.type)} · ${esc(d.name)}</div>
      <div class="muted">${when(r.createdAt)}${me.role==="owner"?" · "+esc(installerLabel(r.installerId)):""}</div>
      ${r.text?`<div class="x">${esc(r.text)}</div>`:""}</div>
    <div class="row">${r.status==="open"?`<a class="btn fill sm" href="#device/${encodeURIComponent(r.deviceId)}">טיפול</a>
      <button class="btn out sm" data-reject="${esc(r._id)}">דחה</button>`:`<span class="pill ${r.status==="approved"?"active":"released"}">${r.status==="approved"?"אושרה":"נדחתה"}</span>`}</div></div>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-reject]"); if(!b) return;
  const r=D.requests.find(x=>x._id===b.dataset.reject); if(!r) return;
  b.disabled=true;
  try{ await commit([{set:"requests/"+r._id,data:{status:"rejected",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]},
                     audit(r.deviceId,"request_rejected",REQ_TYPE[r.type])]);
       toast("הבקשה נדחתה"); load(); }catch(err){ toast("הפעולה נכשלה"); b.disabled=false; }
});

// ---------------------------------------------------------------- devices
let devFilter="all", devSearch="";
function vDevices(v){
  const f={all:"הכל",pending:"ממתינים להפעלה",active:"מוגנים",stale:"לא מתחברים",released:"שוחררו"};
  v.innerHTML=`<section class="card"><div class="bd">
    <div class="toolbar"><input type="search" id="q" placeholder="חיפוש לפי שם או טלפון" value="${esc(devSearch)}" aria-label="חיפוש">
      <div class="chips">${Object.entries(f).map(([k,t])=>`<button class="chip ${devFilter===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div></div>
    <div class="tablewrap"><table><thead><tr><th>שם</th><th>טלפון</th>${me.role==="owner"?"<th>מתקין</th>":""}<th>מצב</th><th>מסלול</th><th>נראה לאחרונה</th><th>גרסה</th></tr></thead>
    <tbody id="devRows"></tbody></table></div><div id="devEmpty" class="empty" hidden>לא נמצאו מכשירים</div></div></section>`;
  const draw=()=>{
    const q=devSearch.trim();
    const rows=D.devices.filter(d=>{
      if(q && !(String(d.name).includes(q)||String(d.phone).includes(q))) return false;
      if(devFilter==="stale") return isStale(d);
      return devFilter==="all"||d.status===devFilter;
    }).sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||(b.createdAt||0)-(a.createdAt||0));
    $("devRows").innerHTML=rows.map(d=>{const st=stateOf(d._id)||{}, pol=parse(d.policy)||{};
      return `<tr class="click" data-go="${encodeURIComponent(d._id)}"><td><b>${esc(d.name)}</b></td>
      <td class="num" dir="ltr" style="text-align:right">${esc(d.phone)}</td>${me.role==="owner"?`<td>${esc(installerLabel(d.installerId))}</td>`:""}
      <td>${pill(statusOf(d))}</td><td>${esc(MODE_NAME[pol.filter_mode||st.filter_mode]||"—")}</td>
      <td>${ago(lastSeen(d._id))}</td><td class="num">${esc(st.appVersion||d.appVersion||"")}</td></tr>`;}).join("");
    $("devEmpty").hidden=rows.length>0;
  };
  draw();
  $("q").oninput=e=>{devSearch=e.target.value; draw();};
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{devFilter=b.dataset.f; vDevices(v);});
  $("devRows").onclick=e=>{const tr=e.target.closest("tr[data-go]"); if(tr) location.hash="#device/"+tr.dataset.go;};
}

// ---------------------------------------------------------------- device page
function vDevice(id){
  const v=$("view"), d=devById(id);
  if(!d){ v.innerHTML='<a class="back" href="#devices">'+icon("back")+' חזרה למכשירים</a><div class="empty">המכשיר לא נמצא</div>'; return; }
  const st=stateOf(id)||{}, apps=appsOf(id), s=statusOf(d), myReqs=D.requests.filter(r=>r.deviceId===id);
  const openReq=myReqs.find(r=>r.status==="open");
  if(draft&&draft.id!==id) draft=null;
  const pol = draft ? draft.p : currentPolicy(d);
  const mark=()=>{ if(!draft) draft={id,p:JSON.parse(JSON.stringify(pol))}; return draft.p; };
  const warn=[];
  if(st.owner===false) warn.push("האפליקציה אינה מנהלת את המכשיר, ולכן שינויים לא יוחלו בו.");
  if(st.lastErr) warn.push("שגיאה אחרונה במכשיר: "+st.lastErr);
  if(isStale(d)) warn.push("המכשיר לא התחבר "+ago(lastSeen(id))+". השינויים יוחלו כשיתחבר.");
  const primaryLabel = d.status==="active" ? "שמור והחל במכשיר" : "אשר והפעל את הסינון";

  v.innerHTML=`<a class="back" href="#devices">${icon("back")} חזרה למכשירים</a>
  <div class="split">
    <div class="grid">
      <section class="card"><div class="hd"><h2>${esc(d.name)}</h2>${pill(s)}<span class="spacer"></span>${draft?'<span class="muted">יש שינויים שלא נשמרו</span>':""}</div>
        <div class="bd">
          ${openReq?`<div class="note warn" style="margin-bottom:14px"><b>${esc(REQ_TYPE[openReq.type])}</b> · ${when(openReq.createdAt)}${openReq.text?"<br>"+esc(openReq.text):""}</div>`:""}
          ${warn.map(w=>`<div class="note err" style="margin-bottom:10px">${esc(w)}</div>`).join("")}
          ${d.status==="released"?`<div class="note info">המכשיר שוחרר ואינו מנוהל יותר.</div>`:`
          ${d.status==="pending"?`<div class="note info" style="margin-bottom:14px">כך יוגדר המכשיר כשתאשרו. ${d.legacy?"ההגנה כבר פעילה במכשיר מהתקנה קודמת, והאישור יעביר אותו לניהול שלכם.":"עד האישור, הסינון אינו פעיל במכשיר."}</div>`:""}
          <h3 style="font-size:15px;margin-bottom:10px">מסלול</h3>
          ${MODES.map(m=>`<label class="opt ${pol.filter_mode===m.v?"on":""}"><input type="radio" name="mode" value="${m.v}" ${pol.filter_mode===m.v?"checked":""}><span><b>${m.t}</b><span class="muted">${esc(m.d)}</span></span></label>`).join("")}
          <h3 style="font-size:15px;margin:18px 0 4px">הגדרות</h3>
          ${SETTINGS.map(([k,t])=>`<div class="sw"><span>${t}</span><label class="toggle"><input type="checkbox" data-k="${k}" ${pol.settings[k]?"checked":""} aria-label="${t}"><i></i></label></div>
            ${k==="disable_sensible_apps"&&pol.settings[k]?sensBlock(pol,apps):""}`).join("")}
          <div class="row" style="margin-top:18px">
            <button class="btn fill" id="saveBtn">${primaryLabel}</button>
            ${draft?'<button class="btn text" id="undoBtn">בטל שינויים</button>':""}
            <span class="spacer"></span>
            ${d.status==="active"||openReq&&openReq.type==="remove"?'<button class="btn danger" id="releaseBtn">שחרר מכשיר</button>':""}
          </div>`}
        </div></section>
      <section class="card"><div class="hd"><h2>היסטוריית בקשות</h2></div>
        <div class="list">${myReqs.map(reqItem).join("")||'<div class="empty">אין בקשות מהמכשיר</div>'}</div></section>
    </div>
    <div class="grid">
      <section class="card"><div class="hd"><h2>פרטים</h2></div><div class="bd"><dl class="kv">
        <dt>טלפון</dt><dd class="num" dir="ltr" style="text-align:right">${esc(d.phone)}</dd>
        ${d.email?`<dt>מייל</dt><dd dir="ltr" style="text-align:right">${esc(d.email)}</dd>`:""}
        <dt>מתקין</dt><dd>${esc(installerLabel(d.installerId))}</dd>
        <dt>נרשם</dt><dd>${when(d.createdAt)}</dd>
        <dt>נראה לאחרונה</dt><dd>${ago(lastSeen(id))}</dd>
        <dt>גרסה</dt><dd class="num">${esc(st.appVersion||d.appVersion||"—")}</dd>
        <dt>הגנה במכשיר</dt><dd>${st.protected?"פעילה":"לא פעילה"}</dd>
      </dl>
      ${me.role==="owner"?`<div class="sw" style="margin-top:10px"><span>חסום פניות למערכת מהמכשיר הזה</span><label class="toggle"><input type="checkbox" id="msgBlk" ${d.msgBlocked?"checked":""} aria-label="חסום פניות"><i></i></label></div>`:""}
      ${me.role==="owner"?`<div class="field" style="margin:16px 0 0"><label class="f" for="reassign">העבר למתקין</label>
        <div class="row"><select id="reassign" style="flex:1"><option value="owner">${esc(D.config.ownerName||"מוקד קיידרואיד")} (אני)</option>
        ${D.installers.filter(i=>i.active).map(i=>`<option value="${esc(i._id)}" ${d.installerId===i._id?"selected":""}>${esc(i.name)}</option>`).join("")}</select>
        <button class="btn out sm" id="reassignBtn">העבר</button></div></div>`:""}
      </div></section>
      ${d.status!=="released"?`<section class="card"><div class="hd">${icon("key")}<h2>קוד חירום</h2></div><div class="bd">
        <p class="muted" style="margin-top:0">כשאין למכשיר אינטרנט: בקשו מהמשתמש את המספר שמופיע אצלו במסך "קוד חירום".</p>
        <div class="field"><label class="f" for="chal">המספר מהמכשיר</label><input type="text" id="chal" inputmode="numeric" dir="ltr" placeholder="8 ספרות" class="num"></div>
        <div class="field"><label class="f" for="emAct">מה לאשר</label><select id="emAct">${EMERG.map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></div>
        <button class="btn tonal" id="emBtn" style="width:100%">צור קוד</button>
        <div id="emOut" hidden style="margin-top:14px"><div class="muted" style="text-align:center">הקריאו למשתמש:</div><div class="bigcode num" id="emCode"></div></div>
      </div></section>`:""}
      ${me.role==="owner"?`<section class="card"><div class="hd"><h2>יומן שינויים</h2></div><div class="list" id="auditList"><div class="empty">טוען…</div></div></section>
        <div><button class="btn danger sm" id="deleteBtn">מחק את המכשיר מהמערכת</button></div>`:""}
    </div>
  </div>`;

  v.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{ mark().filter_mode=r.value; vDevice(id); });
  v.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{ mark().settings[c.dataset.k]=c.checked; vDevice(id); });
  v.querySelectorAll('[data-app]').forEach(c=>c.onchange=()=>{ const p=mark(); const set=new Set(p.hiddenApps||[]);
    c.checked?set.add(c.dataset.app):set.delete(c.dataset.app); p.hiddenApps=[...set]; });
  if($("undoBtn")) $("undoBtn").onclick=()=>{ draft=null; vDevice(id); };
  if($("saveBtn")) $("saveBtn").onclick=()=>savePolicy(d,pol,openReq);
  if($("releaseBtn")) $("releaseBtn").onclick=()=>releaseDevice(d,openReq);
  if($("emBtn")) $("emBtn").onclick=async()=>{
    const ch=$("chal").value.replace(/\D/g,""); if(ch.length!==8){ toast("המספר מהמכשיר צריך להיות 8 ספרות"); return; }
    if(!d.secret){ toast("אין למכשיר מפתח חירום"); return; }
    const act=$("emAct").value, code=await hmacCode(d.secret,ch,act);
    $("emCode").textContent=code.slice(0,3)+" "+code.slice(3); $("emOut").hidden=false;
    commit([audit(id,"emergency_code",EMERG.find(x=>x[0]===act)[1])]).catch(()=>{});
  };
  if($("msgBlk")) $("msgBlk").onchange=()=>setMsgBlock(id,()=>vDevice(id));
  if($("reassignBtn")) $("reassignBtn").onclick=async()=>{
    const to=$("reassign").value; if(to===d.installerId) return;
    const inst=D.installers.find(i=>i._id===to);
    try{ await commit([{set:"devices/"+id,data:{installerId:to,installerName:inst?inst.name:(D.config.ownerName||""),installerPhone:inst?inst.phone:(D.config.ownerPhone||"")},mask:["installerId","installerName","installerPhone"]},
        audit(id,"reassigned","אל "+installerLabel(to))]); toast("המכשיר הועבר"); load(); }catch(e){ toast("ההעברה נכשלה"); }
  };
  if($("deleteBtn")) $("deleteBtn").onclick=()=>confirmDlg("מחיקת המכשיר מהמערכת","המכשיר יימחק מהפאנל. אם הוא עדיין מותקן, ההגנה בו תמשיך לפעול כמו שהיא, אבל לא תוכלו לשלוט בו מרחוק.","מחק",async()=>{
    await commit([{del:"devices/"+id},{del:"reports/"+id},audit(id,"deleted",d.name)]); draft=null; location.hash="#devices"; load(); });
  if(me.role==="owner") query("audit","deviceId",id).then(list=>{ const el=$("auditList"); if(!el) return;
    list.sort((a,b)=>b.at-a.at); el.innerHTML=list.slice(0,30).map(a=>`<div class="item"><div class="main"><div class="t">${esc(auditText(a))}</div><div class="muted">${esc(a.byName||"")} · ${when(a.at)}</div></div></div>`).join("")||'<div class="empty">אין שינויים עדיין</div>'; }).catch(()=>{});
}
function sensBlock(pol,apps){
  if(!apps) return '<div class="note info" style="margin:6px 0 10px">המכשיר עוד לא שלח את רשימת האפליקציות שלו.</div>';
  const on=new Set(pol.hiddenApps||[]);
  return `<div class="note warn" style="margin-top:6px">השבתת אפליקציות מערכת עשויה לגרום לתקלות במכשיר. לא מומלץ להוסיף אפליקציות מעבר לרשימה שנבחרה מראש.</div>
  <div class="applist">${apps.map(a=>`<label><input type="checkbox" data-app="${esc(a.p)}" ${on.has(a.p)?"checked":""}><span>${esc(a.l)}<small>${esc(a.p)}</small></span></label>`).join("")}</div>`;
}
const AUDIT={msg_blocked:"חסימת פניות",msg_unblocked:"ביטול חסימת פניות",policy_saved:"עדכון מסלול והגדרות",activated:"הפעלת הסינון",released:"שחרור המכשיר",request_rejected:"דחיית בקשה",emergency_code:"יצירת קוד חירום",reassigned:"העברה למתקין",deleted:"מחיקה"};
const auditText = a => (AUDIT[a.action]||a.action)+(a.detail?": "+a.detail:"");
const policySummary = p => (MODE_NAME[p.filter_mode]||"")+" · "+SETTINGS.filter(([k])=>p.settings[k]).length+" הגבלות";

async function savePolicy(d,pol,openReq){
  const b=$("saveBtn"); b.disabled=true; b.textContent="שומר…";
  const st=stateOf(d._id)||{};
  const rev=Math.max(Date.now(),(d.rev||0)+1,(st.appliedRev||0)+1);
  const payload={filter_mode:pol.filter_mode,settings:pol.settings}; if(Array.isArray(pol.hiddenApps)) payload.hiddenApps=pol.hiddenApps;
  const inst = d.installerId==="owner" ? {name:D.config.ownerName||"",phone:D.config.ownerPhone||""}
             : (me.role==="installer" ? {name:me.name,phone:me.phone} : (D.installers.find(i=>i._id===d.installerId)||{}));
  const activating = d.status!=="active";
  const w=[{set:"devices/"+d._id,data:{status:"active",policy:JSON.stringify(payload),rev,installerName:inst.name||"",installerPhone:inst.phone||"",updatedAt:Date.now(),updatedBy:me.uid},
            mask:["status","policy","rev","installerName","installerPhone","updatedAt","updatedBy"]},
           audit(d._id,activating?"activated":"policy_saved",policySummary(pol))];
  if(openReq&&openReq.type!=="remove") w.push({set:"requests/"+openReq._id,data:{status:"approved",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]});
  try{ await commit(w); draft=null; toast(activating?"הסינון אושר. הוא יופעל במכשיר בדקות הקרובות.":"נשמר. המכשיר יקבל את השינוי בדקות הקרובות."); await load(); }
  catch(e){ toast("השמירה נכשלה: "+e.message); b.disabled=false; b.textContent="נסו שוב"; }
}
function releaseDevice(d,openReq){
  confirmDlg("שחרור המכשיר","הסינון יוסר מהמכשיר של "+d.name+", והמשתמש יוכל להסיר את קיידרואיד. אי אפשר לבטל את הפעולה מרחוק.","שחרר",async()=>{
    const w=[{set:"devices/"+d._id,data:{status:"released",rev:Math.max(Date.now(),(d.rev||0)+1),updatedAt:Date.now(),updatedBy:me.uid},mask:["status","rev","updatedAt","updatedBy"]},
             audit(d._id,"released",d.name)];
    if(openReq) w.push({set:"requests/"+openReq._id,data:{status:"approved",handledBy:me.uid,handledAt:Date.now()},mask:["status","handledBy","handledAt"]});
    await commit(w); draft=null; toast("המכשיר ישוחרר כשיתחבר"); load();
  },d.name);
}
async function hmacCode(secret,ch,act){
  const enc=new TextEncoder();
  const k=await crypto.subtle.importKey("raw",enc.encode(secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const b=new Uint8Array(await crypto.subtle.sign("HMAC",k,enc.encode(ch+"|"+act)));
  const n=((b[0]&0x7f)<<24)|(b[1]<<16)|(b[2]<<8)|b[3];
  return String(n%1000000).padStart(6,"0");
}

        <div class="x">${esc(m.text)}</div>
        ${m.reply?`<div class="note ok" style="margin-top:8px"><b>התשובה שלך:</b> ${esc(m.reply)}</div>`:m.status==="closed"?`<div class="muted" style="margin-top:6px">סומנה כטופלה</div>`:
          `<div class="field" style="margin:10px 0 0"><textarea data-reply="${esc(m._id)}" placeholder="תשובה שתופיע למשתמש באפליקציה" aria-label="תשובה"></textarea></div>

  $("msgSwitch").onclick=async()=>{ try{ await commit([{set:"config/public",data:{messagesOff:!off},mask:["messagesOff"]}]);
    D.config.messagesOff=!off; toast(off?"קבלת הפניות נפתחה":"קבלת הפניות נסגרה לכולם"); vMessages(v); }catch(e){ toast("הפעולה נכשלה"); } };
  v.querySelectorAll("[data-block]").forEach(b=>b.onclick=()=>setMsgBlock(b.dataset.block,()=>vMessages(v)));
  v.querySelectorAll("[data-mf]").forEach(b=>b.onclick=()=>{msgFilter=b.dataset.mf; vMessages(v);});

async function setMsgBlock(id,after){
  const d=devById(id); if(!d) return; const on=!d.msgBlocked;
  try{ await commit([{set:"devices/"+id,data:{msgBlocked:on},mask:["msgBlocked"]},audit(id,on?"msg_blocked":"msg_unblocked",d.name)]);
       d.msgBlocked=on; toast(on?"המכשיר נחסם לשליחת פניות":"החסימה בוטלה"); after&&after(); }catch(e){ toast("הפעולה נכשלה"); }
}

  v.innerHTML=`<div class="split"><section class="card"><div class="hd"><h2>מתקינים</h2></div>
    <div class="tablewrap"><table><thead><tr><th>שם</th><th>טלפון</th><th>מייל</th><th>קוד מתקין</th><th>מכשירים</th><th>מצב</th><th></th></tr></thead><tbody>
    ${D.installers.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td class="num" dir="ltr" style="text-align:right">${esc(i.phone)}</td><td dir="ltr" style="text-align:right">${esc(i.email)}</td>

    </tbody></table>${D.installers.length?"":'<div class="empty">עוד אין מתקינים</div>'}</div></section>
    <section class="card"><div class="hd"><h2>מתקין חדש</h2></div><form class="bd" id="newInst">
      <div class="field"><label class="f" for="niName">שם מלא *</label><input id="niName" type="text" required></div>
      <div class="field"><label class="f" for="niPhone">טלפון *</label><input id="niPhone" type="tel" dir="ltr" required></div>
      <div class="field"><label class="f" for="niMail">מייל לכניסה לפאנל *</label><input id="niMail" type="email" dir="ltr" required></div>
      <div class="field"><label class="f" for="niPass">סיסמה ראשונית *</label><input id="niPass" type="text" dir="ltr" minlength="8" required>
        <div class="muted" style="margin-top:4px">לפחות 8 תווים. המתקין יוכל להחליף אותה בהגדרות.</div></div>
      <button class="btn fill" type="submit" style="width:100%">צור מתקין</button><p class="err" id="niErr"></p></form></section></div>`;
  $("newInst").onsubmit=async e=>{
    e.preventDefault(); $("niErr").textContent="";
    const name=$("niName").value.trim(), phone=$("niPhone").value.trim(), email=$("niMail").value.trim().toLowerCase(), pw=$("niPass").value;
    const btn=e.target.querySelector("button[type=submit]"); btn.disabled=true;
    try{
      const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pw,returnSecureToken:false})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error&&j.error.message||"signup");
      const uid=j.localId; let code="";
      for(let t=0;t<10;t++){ const c=String(100000+Math.floor(Math.random()*900000)); if(!(await getDoc("installerCodes/"+c))){ code=c; break; } }
      if(!code) throw new Error("code");

// ---------------------------------------------------------------- dialog
function confirmDlg(title,body,okLabel,fn,typeToConfirm){
  const dlg=$("dlg");
  $("dlgIn").innerHTML=`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p>
    ${typeToConfirm?`<div class="field"><label class="f" for="dlgType">לאישור, הקלידו את השם: <b>${esc(typeToConfirm)}</b></label><input id="dlgType" type="text"></div>`:""}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn text" id="dlgNo">ביטול</button><button class="btn danger fill" id="dlgOk" ${typeToConfirm?"disabled":""}>${esc(okLabel)}</button></div>`;
  if(typeToConfirm) $("dlgType").oninput=e=>{$("dlgOk").disabled=e.target.value.trim()!==String(typeToConfirm).trim();};
  $("dlgNo").onclick=()=>dlg.close();
  $("dlgOk").onclick=async()=>{ $("dlgOk").disabled=true; try{ await fn(); dlg.close(); }catch(e){ toast("הפעולה נכשלה"); $("dlgOk").disabled=false; } };
  dlg.showModal();
}
